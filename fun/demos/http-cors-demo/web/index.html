<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Fun CORS demo</title>
  <style>
    body { font: 15px/1.5 system-ui, sans-serif; margin: 2rem auto; max-width: 760px; padding: 0 1rem; }
    button { margin: 0 .5rem .5rem 0; padding: .4rem .8rem; }
    pre { background: #f4f4f4; padding: 1rem; overflow: auto; white-space: pre-wrap; }
    code { background: #eee; padding: .1rem .3rem; }
  </style>
</head>
<body>
  <h1>Fun CORS demo</h1>
  <p>
    Page origin: <code>http://127.0.0.1:5173</code><br>
    API origin: <code>http://127.0.0.1:8080</code>
  </p>
  <button id="get">GET /api/public</button>
  <button id="post">POST /api/echo</button>
  <pre id="out">Click a button.</pre>

  <script>
    const API = 'http://127.0.0.1:8080';
    const out = document.getElementById('out');

    async function show(label, url, opts) {
      out.textContent = label + ' ...';
      try {
        const r = await fetch(url, opts);
        const body = await r.text();
        out.textContent =
          label + '\n' +
          'status: ' + r.status + '\n' +
          'X-Request-Id: ' + (r.headers.get('X-Request-Id') || '(not exposed)') + '\n\n' +
          body;
      } catch (e) {
        out.textContent = label + '\nCORS/fetch error: ' + e;
      }
    }

    document.getElementById('get').onclick = () =>
      show('GET /api/public', API + '/api/public', { credentials: 'include' });

    document.getElementById('post').onclick = () =>
      show('POST /api/echo', API + '/api/echo', {
        method: 'POST',
        credentials: 'include',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ hello: 'fun' })
      });
  </script>
</body>
</html>
