# Continuous integration: build the interpreter and run the regression suite
# on five platforms - Linux / macOS / Windows, x64 for each, arm64 for the
# two where an FPC target exists.
#
#   linux-x64    ubuntu-24.04      native FPC + full suite
#   linux-arm64  ubuntu-24.04-arm  native FPC + full suite (linux-aarch64 skips)
#   macos-x64    macos-15-intel    FPC universal dmg + macOS suite
#   macos-arm64  macos-latest      Homebrew FPC 3.2.2 bottle + macOS suite
#   linux-safe   ubuntu-24.04      SAFE=1 build + focused capability test only
#   windows-x64  windows-latest    FPC (ppcrossx64) + the Windows runner (portable subset)
#
# windows-arm64 is disabled: FPC 3.2.2 has no win64/aarch64 target, so there is
# no toolchain to build with (see the commented-out job at the end of the file;
# re-enable it when a >= 3.3.x FPC with aarch64-windows support is pinned).
#
# The POSIX runner auto-detects the host and reads a per-platform skip list
# (fun/test/regression-skip-<platform>.txt) plus optional
# fun/test/expected/<platform>/ snapshots; see fun/test/run-linux-regression.sh
# and art/notes/macos-port.md.
#
# Manual run: Actions -> regression -> Run workflow. Tick "safe_only" to run
# just the linux-safe job (strict + readonly). Push, pull_request and a normal
# manual run execute every job, including linux-safe.
#
# Status: all six jobs are a gate. The win64 build gets regex from the
# pcre3.dll that the job compiles with MinGW-w64 gcc (best effort), and
# run-windows-regression.bat still probes for the engine so a regex-less build
# skips the regex-dependent tests instead of failing. The remaining
# host-dependent entries are listed there too. See the README "Regression tests
# and CI" section.
name: regression

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
    inputs:
      safe_only:
        description: "Run only the safe build and its focused tests"
        type: boolean
        default: false

# Homebrew installs FPC (arm64) and openssl@3. Its per-install auto-update and
# cleanup dominate a bottle that is already in the download cache, so skip
# them: CI only needs the files in the Cellar.
env:
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1

# Cancel an in-progress run when the same ref is pushed again.
concurrency:
  # A manual safe-only run must not cancel an in-progress full regression.
  group: regression-${{ github.ref }}-${{ github.event_name == 'workflow_dispatch' && inputs.safe_only && 'safe' || 'full' }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- POSIX ---
  unix:
    name: ${{ matrix.name }}
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.safe_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            platform: linux
            fpc_tar: fpc-3.2.2.x86_64-linux.tar
            build: ./make-linux-x86_64.sh
            fetch_all: true
            tcc: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux-aarch64
            fpc_tar: fpc-3.2.2.aarch64-linux.tar
            build: ./make-linux-x86_64.sh
            fetch_all: true
            tcc: true
          - name: macos-x64
            os: macos-15-intel
            platform: macos
            fpc_tar: ""
            build: ./make-macos.sh
            fetch_all: true
            tcc: true
          - name: macos-arm64
            os: macos-latest
            platform: macos-aarch64
            fpc_tar: ""
            build: ./make-macos.sh
            fetch_all: true
            tcc: true
    runs-on: ${{ matrix.os }}
    # A hard ceiling: install/hdiutil steps have hung on macOS runners before,
    # and the default six-hour limit is not a useful failure mode.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # Evaluate the input hash once, into a step output. GitHub re-evaluates a
      # cache action's `key` for its post-save step; `hashFiles` at that point
      # can see the freshly built funcmd/libtcc under src/ and would save under
      # a different key than the one restored next run.
      - name: Compute Pascal build input hash
        id: src-hash
        run: echo "value=${{ hashFiles('src/**') }}" >> "$GITHUB_OUTPUT"

      # Build reuse: every input to the compiled interpreter is under src/
      # (the make scripts pin the FPC flags and third-party versions), while
      # fun/ is interpreted at run time. When src/ is unchanged - a
      # Fun-code-only change - the toolchain install and the Pascal/C build
      # are both skipped and the suite runs against the cached binary.
      - name: Restore built funcmd
        id: cache-funcmd
        uses: actions/cache@v4
        with:
          path: |
            src/prj/fun/funcmd
            src/prj/fun/funcmd-safe
          # v2 also caches funcmd-safe (see the build step).
          key: funcmd-v2-${{ matrix.name }}-fpc-3.2.2-${{ steps.src-hash.outputs.value }}

      # libtcc is dlopen'd next to funcmd by lib-tcc.fun; Linux produces
      # libtcc.so and macOS x64 produces libtcc.dylib. It is a separate
      # artifact from the interpreter.
      - name: Restore libtcc (Linux/macOS)
        if: matrix.tcc
        id: cache-libtcc
        uses: actions/cache@v4
        with:
          path: |
            src/prj/fun/libtcc.so
            src/prj/fun/libtcc.dylib
          key: libtcc-v2-${{ matrix.name }}-${{ steps.src-hash.outputs.value }}

      - name: Cache Free Pascal (Linux)
        if: runner.os == 'Linux' && (steps.cache-funcmd.outputs.cache-hit != 'true' || (matrix.tcc && steps.cache-libtcc.outputs.cache-hit != 'true'))
        id: cache-fpc
        uses: actions/cache@v4
        with:
          path: |
            ~/fpc-3.2.2
            ~/.fpc.cfg
          key: ${{ matrix.fpc_tar }}

      - name: Install Free Pascal 3.2.2 (Linux)
        if: runner.os == 'Linux' && (steps.cache-funcmd.outputs.cache-hit != 'true' || (matrix.tcc && steps.cache-libtcc.outputs.cache-hit != 'true')) && steps.cache-fpc.outputs.cache-hit != 'true'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o fpc.tar \
            "https://downloads.sourceforge.net/project/freepascal/Linux/3.2.2/${{ matrix.fpc_tar }}"
          mkdir -p fpc && tar -xf fpc.tar -C fpc
          cd fpc/fpc-3.2.2.*-linux
          # install.sh is interactive: first line is the prefix, the rest accept
          # the defaults (install all unit packages, including libffi + hash).
          printf '%s\n\n\n\n\n\n\n\n\n\n' "$HOME/fpc-3.2.2" | ./install.sh

      - name: Put fpc on PATH (Linux)
        if: runner.os == 'Linux' && (steps.cache-funcmd.outputs.cache-hit != 'true' || (matrix.tcc && steps.cache-libtcc.outputs.cache-hit != 'true'))
        run: echo "$HOME/fpc-3.2.2/bin" >> "$GITHUB_PATH"

      - name: Install OpenSSL (lib-crypto tests)
        if: runner.os == 'Linux'
        run: |
          # The runner image already ships libssl-dev on most images; only pay
          # for an apt index refresh + install when it is actually missing.
          if dpkg -s libssl-dev >/dev/null 2>&1; then
            echo "libssl-dev already installed"
          else
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends libssl-dev
          fi

      # lib-ado-unx keeps SQLite embedded by default; the unixODBC backend and
      # run-ado-odbc.sh are exercised when a driver manager plus a SQLite ODBC
      # driver are present.
      - name: Install unixODBC + SQLite ODBC driver (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends unixodbc libsqliteodbc

      - name: Cache FPC installer dmg (macOS Intel)
        if: runner.os == 'macOS' && runner.arch == 'X64' && (steps.cache-funcmd.outputs.cache-hit != 'true' || (matrix.tcc && steps.cache-libtcc.outputs.cache-hit != 'true'))
        uses: actions/cache@v4
        with:
          path: ~/fpc-cache
          key: fpc-dmg-3.2.2-intelarm64

      # The arm64 bottle has no dependencies, so caching the Cellar is enough:
      # a hit only needs `brew link` to recreate the /opt/homebrew/bin
      # symlinks, which skips the bottle pour entirely.
      - name: Cache FPC 3.2.2 bottle install (macOS arm64)
        if: runner.os == 'macOS' && runner.arch == 'ARM64' && (steps.cache-funcmd.outputs.cache-hit != 'true' || (matrix.tcc && steps.cache-libtcc.outputs.cache-hit != 'true'))
        id: cache-fpc-macos-arm64
        uses: actions/cache@v4
        with:
          path: |
            /opt/homebrew/Cellar/fpc
            /opt/homebrew/opt/fpc
          key: brew-fpc-3.2.2-arm64-v1

      - name: Cache Homebrew downloads (macOS)
        if: runner.os == 'macOS'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-downloads-${{ runner.arch }}

      - name: Install Free Pascal 3.2.2 (macOS)
        if: runner.os == 'macOS' && (steps.cache-funcmd.outputs.cache-hit != 'true' || (matrix.tcc && steps.cache-libtcc.outputs.cache-hit != 'true'))
        run: |
          set -e
          if [ "$(uname -m)" = "arm64" ]; then
            # Homebrew has an FPC 3.2.2 arm64 bottle (sequoia / tahoe / golden
            # gate). The official universal dmg, by contrast, is a PackageMaker
            # .mpkg that current macOS refuses ("This package is incompatible
            # with this version of macOS") and that pkgutil --expand cannot even
            # open, so use the bottle on Apple Silicon.
            if [ "${{ steps.cache-fpc-macos-arm64.outputs.cache-hit }}" = "true" ]; then
              # Cellar + opt were restored by the cache; refresh bin symlinks.
              brew link --overwrite fpc || true
            fi
            if ! command -v fpc >/dev/null 2>&1; then
              brew install fpc
            fi
          else
            cd "$RUNNER_TEMP"
            # Intel runners have no Homebrew bottle for fpc, so use the official
            # universal dmg (fpc-3.2.2-intelarm64-macosx.mpkg), which installs
            # fine there. Cache the 274 MB download between runs.
            #
            # hdiutil has been seen to hang on runners, so every phase is
            # bounded. The ::warning annotations also leave a visible trail
            # outside the (admin-only) job log.
            run_limited() {
              secs="$1"; shift
              if command -v timeout >/dev/null 2>&1; then timeout "$secs" "$@"
              elif command -v gtimeout >/dev/null 2>&1; then gtimeout "$secs" "$@"
              else "$@"
              fi
            }
            CACHE="$HOME/fpc-cache"; mkdir -p "$CACHE"
            if [ -f "$CACHE/fpc.dmg" ]; then
              cp -f "$CACHE/fpc.dmg" fpc.dmg
            else
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o fpc.dmg \
                "https://downloads.sourceforge.net/project/freepascal/Mac%20OS%20X/3.2.2/fpc-3.2.2.intelarm64-macosx.dmg"
              cp -f fpc.dmg "$CACHE/fpc.dmg"
            fi
            ls -l fpc.dmg
            echo "::warning title=fpc-intel phase::dmg ready"
            MOUNT="$RUNNER_TEMP/fpcmnt"
            mkdir -p "$MOUNT"
            if ! run_limited 90 hdiutil attach fpc.dmg -nobrowse -mountpoint "$MOUNT"; then
              echo "::error title=macos fpc install::hdiutil attach failed or timed out"; exit 1
            fi
            echo "::warning title=fpc-intel phase::dmg attached"
            # The dmg layout (volume root vs a wrapper folder, package at any
            # depth) varies, so locate the package instead of hard-coding it.
            # FPC's package is not notarized, so allow it explicitly.
            PKG="$(find "$MOUNT" \( -name '*.mpkg' -o -name '*.pkg' \) | head -n 1)"
            [ -n "$PKG" ] || { echo "::error title=macos fpc install::no package in the dmg"; exit 1; }
            echo "installing $PKG on macOS $(sw_vers -productVersion) $(uname -m)"
            out="$(run_limited 300 sudo installer -pkg "$PKG" -target / -allowUntrusted 2>&1)" || {
              echo "::error title=macos fpc install::installer failed or timed out: $(printf '%s' "$out" | tail -n 3 | tr '\n' '~' | cut -c1-500)"
              exit 1
            }
            echo "::warning title=fpc-intel phase::installer done"
            # Detach must never block the build; a stale mount is harmless.
            run_limited 60 hdiutil detach "$MOUNT" || true
            echo "::warning title=fpc-intel phase::dmg detached"
          fi
          fpc -iV || { echo "::error title=macos fpc install::fpc not on PATH after install"; exit 1; }

      - name: Link OpenSSL (lib-crypto tests)
        if: runner.os == 'macOS'
        run: brew link --force --overwrite openssl@3 || brew install openssl@3

      - name: Cache third-party C sources
        if: steps.cache-funcmd.outputs.cache-hit != 'true' || (matrix.tcc && steps.cache-libtcc.outputs.cache-hit != 'true')
        id: cache-third
        uses: actions/cache@v4
        with:
          path: src/3rd
          key: third-party-v2-${{ runner.os }}-${{ runner.arch }}-${{ matrix.fetch_all }}-${{ hashFiles('src/prj/fun/fetch-3rd-party.sh') }}

      - name: Fetch third-party C sources
        if: (steps.cache-funcmd.outputs.cache-hit != 'true' || (matrix.tcc && steps.cache-libtcc.outputs.cache-hit != 'true')) && steps.cache-third.outputs.cache-hit != 'true'
        run: |
          if [ "${{ matrix.fetch_all }}" = "true" ]; then
            src/prj/fun/fetch-3rd-party.sh
          else
            src/prj/fun/fetch-3rd-party.sh --pcre-only
          fi

      - name: Build funcmd
        if: steps.cache-funcmd.outputs.cache-hit != 'true' || (matrix.tcc && steps.cache-libtcc.outputs.cache-hit != 'true')
        working-directory: src/prj/fun
        run: |
          log="$RUNNER_TEMP/build-${{ matrix.name }}.log"
          if ! ${{ matrix.build }} >"$log" 2>&1; then
            tail -n 40 "$log"
            # Show the real error: the lines just above FPC's Fatal summary.
            err="$(grep -B8 -m1 -E 'Fatal: There were|Fatal: Compilation|Error:' "$log" | tr '\n' '|' | cut -c1-900)"
            echo "::error title=build (${{ matrix.name }})::$err"
            exit 1
          fi
          tail -n 5 "$log"

          # The capability-restricted build ships with every nightly, so it is
          # built here rather than in a separate manual-only job. SAFE=strict
          # is the default safe level; the focused safe regression still runs
          # as its own job below.
          safe_log="$RUNNER_TEMP/build-${{ matrix.name }}-safe.log"
          if ! SAFE=strict ${{ matrix.build }} >"$safe_log" 2>&1; then
            tail -n 40 "$safe_log"
            err="$(grep -B8 -m1 -E 'Fatal: There were|Fatal: Compilation|Error:' "$safe_log" | tr '\n' '|' | cut -c1-900)"
            echo "::error title=safe build (${{ matrix.name }})::$err"
            exit 1
          fi
          grep -E 'SAFE=strict' "$safe_log" || true

      - name: Verify libtcc (macOS)
        if: runner.os == 'macOS'
        run: |
          p=src/prj/fun/libtcc.dylib
          if [ ! -f "$p" ]; then
            echo "::error title=libtcc missing::expected $p after the macOS build"
            echo "third-party contents:"
            ls -la src/3rd || true
            exit 1
          fi
          ls -l "$p"
          file "$p"
          otool -L "$p"
          codesign -dv "$p" 2>&1 || true

      # The build itself copies these into fun/; a cache hit has to do it too,
      # because input-console.sh prefers fun/funcmd when it exists.
      - name: Publish cached funcmd to fun/
        if: steps.cache-funcmd.outputs.cache-hit == 'true'
        run: |
          cp -f src/prj/fun/funcmd fun/funcmd
          cp -f src/prj/fun/funcmd-safe fun/funcmd-safe
          for lib in libtcc.so libtcc.dylib; do
            if [ -f "src/prj/fun/$lib" ]; then
              cp -f "src/prj/fun/$lib" "fun/$lib"
            fi
          done

      - name: jsbox sandbox regression
        run: sh fun/test/run-jsbox-test.sh

      - name: Regression
        env:
          FUNREG_PLATFORM: ${{ matrix.platform }}
        run: fun/test/run-linux-regression.sh

      # Release artifacts are built only from a green run on main. The release
      # workflow downloads these stages from the successful regression run that
      # matches the commit it is about to tag; it never rebuilds.
      - name: Stage release build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p dist-stage
          cp -f src/prj/fun/funcmd dist-stage/
          cp -f src/prj/fun/funcmd-safe dist-stage/
          libtcc=""
          for lib in libtcc.so libtcc.dylib; do
            if [ -f "src/prj/fun/$lib" ]; then
              cp -f "src/prj/fun/$lib" dist-stage/
              libtcc="fun/$lib"
            fi
          done
          # Probe the binaries that will actually be shipped (the build copies
          # them into fun/, where the bundled lib/ is visible to lib-tcc.fun).
          src/prj/fun/release/probe.sh \
            "${{ matrix.name }}" dist-stage/build-env.json \
            fun/funcmd fun/funcmd-safe "$libtcc"

      - name: Upload release stage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fun-stage-${{ matrix.name }}
          path: dist-stage/
          retention-days: 90
          if-no-files-found: error

  # ----------------------------------------------------------------- SAFE ---
  # The safe build is a separate binary (-dFunSafe, funcmd-safe) with native
  # code, raw memory, file I/O and compile-from-file disabled. It has its own
  # focused capability test instead of the full regression suite, so the
  # default build's baseline is unaffected. This is part of the default gate
  # (push/PR/dispatch); a dispatch with safe_only=true runs only this job.
  linux-safe:
    name: linux-safe
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Cache Free Pascal 3.2.2
        id: cache-fpc-safe
        uses: actions/cache@v4
        with:
          path: |
            ~/fpc-3.2.2
            ~/.fpc.cfg
          key: fpc-3.2.2-safe-x86_64-linux

      - name: Install Free Pascal 3.2.2
        if: steps.cache-fpc-safe.outputs.cache-hit != 'true'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o fpc.tar \
            "https://downloads.sourceforge.net/project/freepascal/Linux/3.2.2/fpc-3.2.2.x86_64-linux.tar"
          mkdir -p fpc && tar -xf fpc.tar -C fpc
          cd fpc/fpc-3.2.2.*-linux
          printf '%s\n\n\n\n\n\n\n\n\n\n' "$HOME/fpc-3.2.2" | ./install.sh

      - name: Put fpc on PATH
        run: echo "$HOME/fpc-3.2.2/bin" >> "$GITHUB_PATH"

      - name: Build funcmd-safe (strict)
        run: |
          cd src/prj/fun
          SAFE=strict ./make-linux-x86_64.sh 2>&1 | tee /tmp/build-safe.log
          # The NAT checks exercise getapi/@toCallback. They are only
          # meaningful when the FFI backend is compiled in, which the regular
          # Linux CI also requires.
          grep -q "FFI enabled" /tmp/build-safe.log

      - name: Safe capability regression (strict)
        run: fun/test/run-safe-regression.sh strict

      - name: Build funcmd-safe (readonly)
        run: |
          cd src/prj/fun
          SAFE=readonly ./make-linux-x86_64.sh 2>&1 | tee /tmp/build-safe-readonly.log
          grep -q "FFI enabled" /tmp/build-safe-readonly.log

      - name: Safe capability regression (readonly)
        run: fun/test/run-safe-regression.sh readonly

  # -------------------------------------------------------------- WINDOWS ---
  windows-x64:
    name: windows-x64
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.safe_only }}
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The Windows release archive ships these scripts. Parse them here so a
      # syntax error fails CI instead of the user's first double-click.
      - name: Validate Windows installer syntax
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in @('install.ps1', 'uninstall.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              (Join-Path $PWD $file), [ref]$tokens, [ref]$errors) | Out-Null
            foreach ($e in $errors) {
              Write-Host "::error file=$file,line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
          Write-Host 'install.ps1 and uninstall.ps1 parse cleanly'

      # The helper DLLs feed the interpreter build, so restore them first: the
      # funcmd.exe key records which capabilities the cached binary has. Both
      # caches live before the toolchain so a full hit skips FPC as well.
      - name: Restore pcre3.dll (win64)
        id: cache-pcre-win
        uses: actions/cache/restore@v4
        with:
          path: src\prj\fun\pcre3.dll
          key: win64-pcre3-pcre-8.45-v1

      - name: Restore ffi.dll (win64)
        id: cache-ffi-win
        uses: actions/cache/restore@v4
        with:
          path: src\prj\fun\ffi.dll
          key: win64-ffi-fpc-3.2.2-v1

      - name: Restore libffitest.dll (win64)
        id: cache-libffitest-win
        uses: actions/cache/restore@v4
        with:
          path: fun\test\ffi\libffitest.dll
          key: win64-libffitest-v1

      - name: Mark cached win64 helper DLLs
        shell: pwsh
        run: |
          # GITHUB_ENV is not part of a cache, so set the feature flags from
          # whichever DLLs the restore above actually produced.
          if (Test-Path 'src\prj\fun\pcre3.dll') {
            "FUN_PCRE_DLL=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "pcre3.dll restored from cache"
          }
          if (Test-Path 'src\prj\fun\ffi.dll') {
            "FUN_FFI_DLL=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "ffi.dll restored from cache"
          }
          $global:LASTEXITCODE = 0

      # Freeze both hashes before the build: a cache action's key is
      # re-evaluated for its post-save step, and funcmd.exe lives under src/.
      - name: Compute Windows build input hashes
        id: src-hash
        shell: pwsh
        run: |
          "value=${{ hashFiles('src/**') }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "dlls=${{ hashFiles('src/prj/fun/pcre3.dll', 'src/prj/fun/ffi.dll') }}" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # 64-bit libtcc.dll / zlib.dll. They are loaded by name from next to
      # funcmd.exe, so the archive can only ship them if this job builds them
      # for x86_64 (the copies in fun/ are 32-bit bcc32 builds).
      - name: Restore win64 runtime DLLs
        id: cache-win64-runtime
        uses: actions/cache/restore@v4
        with:
          path: |
            src\prj\fun\libtcc.dll
            src\prj\fun\zlib.dll
          key: win64-runtime-tcc-0.9.27-zlib-1.2.11-v1-${{ steps.src-hash.outputs.value }}

      # Build reuse, same rule as the unix job.
      - name: Restore built funcmd.exe
        id: cache-funcmd-win
        uses: actions/cache@v4
        with:
          path: |
            src\prj\fun\funcmd.exe
            src\prj\fun\funcmd-safe.exe
            src\prj\fun\funcmd.flags.txt
          key: funcmd-v7-win64-fpc-3.2.2-${{ steps.src-hash.outputs.value }}-${{ steps.src-hash.outputs.dlls }}

      - name: Restore FPC cache (Windows)
        if: steps.cache-funcmd-win.outputs.cache-hit != 'true'
        id: cache-fpc-win
        uses: actions/cache/restore@v4
        with:
          path: C:\FPC
          key: fpc-3.2.2-win64-and-cross

      - name: Install Free Pascal 3.2.2 (win32 + win64)
        if: steps.cache-funcmd-win.outputs.cache-hit != 'true' && steps.cache-fpc-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            # curl.exe follows the SourceForge redirect to the actual mirror;
            # Invoke-WebRequest has saved an HTML page here (corrupt .exe).
            # /TYPE=full selects every component, including the win64 compiler:
            # a bare /VERYSILENT install has laid down only bin\i386-win32.
            function Install-Fpc([string]$url, [string]$exe, [string]$label) {
              curl.exe -fL --retry 3 --retry-all-errors -o $exe $url
              if ($LASTEXITCODE -ne 0) { throw "$label curl failed ($LASTEXITCODE)" }
              $sz = (Get-Item $exe).Length
              Write-Host "$label downloaded $sz bytes"
              if ($sz -lt 1000000) { throw "$label download too small ($sz bytes) - not a PE" }
              $p = Start-Process -FilePath $exe -PassThru -Wait `
                -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/TYPE=full", "/DIR=C:\FPC\3.2.2"
              Write-Host "$label installer exit code: $($p.ExitCode)"
            }

            # FPC has no separate win64 installer; the combined win32+win64 one
            # carries both targets (see the layout annotation below for how it
            # actually lays them out).
            Install-Fpc "https://downloads.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe" "$env:RUNNER_TEMP\fpc.exe" "combined"
            # Any of these means the win64 target came with the combined install.
            $win64Evidence = { (Test-Path "C:\FPC\3.2.2\bin\x86_64-win64\fpc.exe") -or
                               (Test-Path "C:\FPC\3.2.2\bin\i386-win32\ppcrossx64.exe") -or
                               (Test-Path "C:\FPC\3.2.2\units\x86_64-win64") }
            for ($i = 0; $i -lt 60 -and -not (& $win64Evidence); $i++) { Start-Sleep -Seconds 2 }

            if (-not (& $win64Evidence)) {
              # The combined installer did not lay down the win64 target, so add
              # fpc-3.2.2.i386-win32.cross.x86_64-win64.exe, which is exactly the
              # win64 target (ppcrossx64 + the x86_64-win64 units).
              Write-Host "no win64 target after the combined install; adding the cross package"
              Install-Fpc "https://downloads.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.i386-win32.cross.x86_64-win64.exe" "$env:RUNNER_TEMP\fpcx.exe" "cross"
              for ($i = 0; $i -lt 60 -and -not (& $win64Evidence); $i++) { Start-Sleep -Seconds 2 }
            }

          } catch {
            Write-Host "::error title=windows fpc install::$($_.Exception.Message)"
            throw
          }

      - name: Put FPC on PATH (Windows)
        if: steps.cache-funcmd-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # Runs for both a fresh install and a cache restore: PATH itself is not
          # cached, and this also validates that the cache held a usable toolchain.
          # The combined installer ships the driver as bin\i386-win32\fpc.exe and
          # targets win64 through bin\i386-win32\ppcrossx64.exe plus the
          # x86_64-win64 units, so do not insist on an x86_64-win64\fpc.exe.
          $compilers = Get-ChildItem C:\FPC -Recurse -Filter fpc.exe -ErrorAction SilentlyContinue
          $fpc = $compilers | Where-Object { $_.FullName -match 'x86_64-win64' } | Select-Object -First 1
          if (-not $fpc) { $fpc = $compilers | Select-Object -First 1 }
          if (-not $fpc) { throw "no fpc.exe under C:\FPC (install or cache restore failed)" }

          # Surface the layout as an annotation: the log itself is not readable
          # from outside, and the win64 arrangement is what bring-up needs.
          $bins = @(Get-ChildItem C:\FPC -Recurse -Include 'fpc.exe', 'pp*.exe' -ErrorAction SilentlyContinue |
                      ForEach-Object { $_.FullName }) -join '; '
          $units = @(Get-ChildItem C:\FPC -Recurse -Directory -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match '[\\/]units' } |
                      ForEach-Object { $_.FullName }) -join '; '
          Write-Host "::warning title=windows fpc layout::compilers=[$bins] units=[$units]"

          $dirs = @($fpc.Directory.FullName)
          $dirs += @($compilers | ForEach-Object { $_.Directory.FullName } |
            Sort-Object -Unique | Where-Object { $_ -ne $fpc.Directory.FullName })
          foreach ($d in $dirs) {
            Write-Host "PATH += $d"
            $d | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          & $fpc.FullName -iV

      - name: Save FPC cache (Windows)
        # actions/cache only saves on a successful job, and this job still fails
        # on the bring-up tests, so save explicitly - before the build/regression
        # steps, while everything above has succeeded (a failed install never
        # poisons the cache).
        if: steps.cache-funcmd-win.outputs.cache-hit != 'true' && steps.cache-fpc-win.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\FPC
          key: fpc-3.2.2-win64-and-cross

      - name: Build pcre3.dll for win64 (regex, best effort)
        if: steps.cache-pcre-win.outputs.cache-hit != 'true'
        working-directory: src\prj\fun
        shell: pwsh
        run: |
          # The win64 build had no regex because nothing compiled PCRE there.
          # Build it as a DLL and let the Pascal side import from it
          # (-dPCRE_WinDLL): linking the MinGW objects straight into funcmd needs
          # the MinGW CRT resolved, which neither of FPC's linkers manages here
          # (the internal one names imports after the declaration; the external
          # one finds no member for __imp_isupper/malloc/... in
          # libucrt/libmsvcrt/libmingwex). GCC links the DLL itself, so the CRT
          # is its own problem, and FPC generates the import table from the DLL
          # name alone. Art.notes port-decisions D27 has the full story.
          #
          # Best effort: on failure the build runs without -dRegex and the
          # runner reports the regex tests as SKIP.
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE 'src\3rd\pcre-8'
          try {
            if (-not (Test-Path (Join-Path $src 'pcre_compile.c'))) {
              $tmp = Join-Path $env:RUNNER_TEMP 'pcre'
              New-Item -ItemType Directory -Force -Path $tmp | Out-Null
              $tar = Join-Path $tmp 'pcre-8.45.tar.gz'
              curl.exe -fsSL --retry 3 --retry-all-errors -o $tar `
                'https://downloads.sourceforge.net/project/pcre/pcre/8.45/pcre-8.45.tar.gz'
              if ($LASTEXITCODE -ne 0) { throw "download failed ($LASTEXITCODE)" }
              tar.exe -xf $tar -C $tmp
              New-Item -ItemType Directory -Force -Path (Split-Path $src) | Out-Null
              Move-Item (Join-Path $tmp 'pcre-8.45') $src
            }
            Copy-Item (Join-Path $src 'config.h.generic') (Join-Path $src 'config.h') -Force
            Copy-Item (Join-Path $src 'pcre.h.generic') (Join-Path $src 'pcre.h') -Force
            Copy-Item (Join-Path $src 'pcre_chartables.c.dist') (Join-Path $src 'pcre_chartables.c') -Force

            # the runner's gcc on PATH has no reachable C headers; this one does
            function Test-CC([string]$exe) {
              if (-not (Test-Path $exe)) { return $false }
              $o = Join-Path $env:RUNNER_TEMP 'cctest.o'
              Remove-Item -Force $o -ErrorAction SilentlyContinue
              'int main(void){return 0;}' | & $exe -c -x c - -o $o 2>&1 | Out-Null
              return (($LASTEXITCODE -eq 0) -and (Test-Path $o))
            }
            $cands = @()
            $onpath = Get-Command gcc -ErrorAction SilentlyContinue
            if ($onpath) { $cands += $onpath.Source }
            $cands += 'C:\mingw64\bin\gcc.exe'
            $cands += 'C:\tools\mingw64\bin\gcc.exe'
            $gcc = $null
            foreach ($c in $cands) {
              if (Test-CC $c) { $gcc = $c; break }
              Write-Host "not usable as a C compiler: $c"
            }
            if (-not $gcc) { throw 'no usable C compiler (tried PATH gcc, C:\mingw64)' }
            Write-Host "gcc: $gcc  target=$(& $gcc -dumpmachine)"

            $lib = Join-Path $src 'win64-dll'
            Remove-Item -Recurse -Force $lib -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $lib | Out-Null
            # the 8-bit sources (pcre_default_tables.c is a dftables-generated
            # duplicate of pcre_chartables.c, so it is left out: linking both
            # would clash on _pcre_default_tables)
            $units = 'pcre_byte_order','pcre_chartables','pcre_compile','pcre_config',
                     'pcre_dfa_exec','pcre_exec','pcre_fullinfo','pcre_get','pcre_globals',
                     'pcre_maketables','pcre_newline','pcre_ord2utf8','pcre_refcount','pcre_string_utils',
                     'pcre_study','pcre_tables','pcre_ucd','pcre_valid_utf8','pcre_version',
                     'pcre_xclass'
            foreach ($u in $units) {
              $c = Join-Path $src "$u.c"
              if (-not (Test-Path $c)) { throw "missing source $u.c" }
              $out = & $gcc -c -O2 -DHAVE_CONFIG_H -DSUPPORT_PCRE8 "-I$src" $c -o (Join-Path $lib "$u.o") 2>&1
              if ($LASTEXITCODE -ne 0) {
                throw "gcc failed: $u :: " + (($out | Select-Object -First 12) -join ' ~ ')
              }
            }
            $dll = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'src\prj\fun') 'pcre3.dll'
            # an import library too: it lets a C probe link the DLL, which is
            # how the diagnostic step checks the DLL itself
            $implib = Join-Path $lib 'libpcre3.dll.a'
            $lo = & $gcc -shared -o $dll "-Wl,--out-implib,$implib" (Get-ChildItem (Join-Path $lib '*.o') | ForEach-Object { $_.FullName }) 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "gcc -shared failed :: " + (($lo | Select-Object -First 12) -join ' ~ ')
            }
            Write-Host "built $dll ($((Get-Item $dll).Length) bytes) next to funcmd.exe"
            "FUN_PCRE_DLL=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "FUN_PCRE_IMPLIB=$implib" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            "FUN_PCRE_DLLSRC=$src" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            # reused by the libffitest step: same compiler, no re-detection
            "FUN_CC=$gcc" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "::warning title=pcre (win64) ok::gcc=$gcc ($(& $gcc -dumpmachine)); pcre3.dll=$((Get-Item $dll).Length) bytes"
          } catch {
            Write-Host "::warning title=pcre (win64)::$($_.Exception.Message)"
          }
          # best-effort: GitHub's pwsh wrapper exits with $LASTEXITCODE
          $global:LASTEXITCODE = 0

      - name: Get libffi for win64 (getapi, best effort)
        if: steps.cache-ffi-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # FPC's bundled `ffi` unit has a WIN64 target (FFI_DEFAULT_ABI =
          # FFI_WIN64), so getapi works on win64 too - it just needs ffi.dll,
          # which the unit's externals name 'ffi'. FPC writes the import table
          # from that name, so nothing else is needed at link time.
          # Best effort: without the DLL the build drops -dWinFFI.
          $ErrorActionPreference = 'Stop'
          try {
            $msys = 'C:\msys64\usr\bin\bash.exe'
            if (-not (Test-Path $msys)) { throw 'no MSYS2 to install libffi from' }
            & $msys -lc 'pacman -Sy --noconfirm --needed mingw-w64-x86_64-libffi' 2>&1 |
              Select-Object -Last 4 | Write-Host
            $ffi = Get-ChildItem 'C:\msys64\mingw64\bin' -Filter 'libffi-*.dll' -ErrorAction SilentlyContinue |
                     Select-Object -First 1
            if (-not $ffi) { throw 'pacman left no libffi-*.dll in C:\msys64\mingw64\bin' }
            $dst = Join-Path $env:GITHUB_WORKSPACE 'src\prj\fun\ffi.dll'
            Copy-Item $ffi.FullName $dst -Force
            "FUN_FFI_DLL=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "::warning title=libffi (win64) ok::copied $($ffi.Name) to src\prj\fun\ffi.dll"
          } catch {
            Write-Host "::warning title=libffi (win64)::$($_.Exception.Message)"
          }
          $global:LASTEXITCODE = 0

      - name: Build libffitest.dll for win64 (FFI tests, best effort)
        if: steps.cache-libffitest-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # The FFI suite (fun/test/ffi/ffi-*.fun) calls a small C helper that
          # fun/test/ffi/build.sh builds per host. Four of the five cases are
          # plain int/double/long-long/callback ABI with host-independent
          # output, so they run on win64 as soon as getapi does (-dWinFFI plus
          # ffi.dll, see the steps above) and the helper is next to its sources
          # as libffitest.dll.
          #
          # --export-all-symbols is what makes the helper's names visible to
          # GetProcAddress: libffitest.c has no __declspec(dllexport), and MinGW
          # exports nothing by default.
          #
          # Best effort: without the DLL the runner adds those four cases to its
          # skip list instead of failing (same rule as pcre3.dll/ffi.dll).
          $ErrorActionPreference = 'Stop'
          try {
            $gcc = $env:FUN_CC
            if (-not $gcc) {
              $onpath = Get-Command gcc -ErrorAction SilentlyContinue
              $cands = @()
              if ($onpath) { $cands += $onpath.Source }
              $cands += 'C:\mingw64\bin\gcc.exe'
              foreach ($c in $cands) {
                if (-not (Test-Path $c)) { continue }
                $o = Join-Path $env:RUNNER_TEMP 'cctest2.o'
                Remove-Item -Force $o -ErrorAction SilentlyContinue
                'int main(void){return 0;}' | & $c -c -x c - -o $o 2>&1 | Out-Null
                if (($LASTEXITCODE -eq 0) -and (Test-Path $o)) { $gcc = $c; break }
              }
            }
            if (-not $gcc) { throw 'no usable C compiler (no FUN_CC, no PATH gcc, no C:\mingw64)' }

            $src = Join-Path $env:GITHUB_WORKSPACE 'fun\test\ffi\libffitest.c'
            $dll = Join-Path $env:GITHUB_WORKSPACE 'fun\test\ffi\libffitest.dll'
            # quoted: PowerShell splits a bare -Wl,--x into two arguments
            $out = & $gcc -O2 -shared '-Wl,--export-all-symbols' -o $dll $src 2>&1
            if ($LASTEXITCODE -ne 0) { throw "gcc -shared failed :: " + (($out | Select-Object -First 12) -join ' ~ ') }

            # report the exports the suite needs, so a 'symbol not found' failure
            # is readable from outside (the job log is not)
            $need = 'big64','passll','addll','applyll','summ','ident','addi','five','fsum',
                    'fdbl','dfromf','mixsum','apply1','dapply','sumvia','cb2','twice_cb',
                    'walk','acc','fc','fire0i','fire0'
            $objdump = Join-Path (Split-Path $gcc) 'objdump.exe'
            $sym = @()
            if (Test-Path $objdump) {
              $sym = (& $objdump -p $dll 2>$null) |
                       Select-String -Pattern '^\s*\[\s*\d+\] (\w+)' |
                       ForEach-Object { $_.Matches[0].Groups[1].Value }
            }
            $missing = @($need | Where-Object { $sym -notcontains $_ })
            $tag = if ($sym.Count -eq 0) { 'objdump unavailable' }
                   elseif ($missing.Count -eq 0) { 'all ' + $need.Count + ' needed symbols' }
                   else { 'MISSING ' + ($missing -join ',') }
            Write-Host "::warning title=libffitest (win64) ok::gcc=$(& $gcc -dumpmachine); dll=$((Get-Item $dll).Length) bytes; exports: $tag"
          } catch {
            Write-Host "::warning title=libffitest (win64)::$($_.Exception.Message)"
          }
          $global:LASTEXITCODE = 0

      - name: Save pcre3.dll (win64)
        if: steps.cache-pcre-win.outputs.cache-hit != 'true'
        # Best effort, matching the build above: never fail the job because a
        # cache could not be written.
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: src\prj\fun\pcre3.dll
          key: win64-pcre3-pcre-8.45-v1

      - name: Save ffi.dll (win64)
        if: steps.cache-ffi-win.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: src\prj\fun\ffi.dll
          key: win64-ffi-fpc-3.2.2-v1

      - name: Save libffitest.dll (win64)
        if: steps.cache-libffitest-win.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: fun\test\ffi\libffitest.dll
          key: win64-libffitest-v1

      - name: Build win64 runtime DLLs (tcc + zlib, best effort)
        if: steps.cache-win64-runtime.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          # libtcc.dll and zlib.dll are loaded by bare name from next to
          # funcmd.exe. The historical copies in fun/ are 32-bit, so win64
          # needs x86_64 builds or runtime C and lib-zlib stay unavailable.
          # Compile the pinned sources directly (build-win64-deps.sh); the
          # same gcc that built pcre3.dll is used.
          $ErrorActionPreference = 'Stop'
          try {
            function Test-CC([string]$exe) {
              if (-not (Test-Path $exe)) { return $false }
              $o = Join-Path $env:RUNNER_TEMP 'cctest-deps.o'
              Remove-Item -Force $o -ErrorAction SilentlyContinue
              'int main(void){return 0;}' | & $exe -c -x c - -o $o 2>&1 | Out-Null
              return (($LASTEXITCODE -eq 0) -and (Test-Path $o))
            }
            $gcc = $env:FUN_CC
            if (-not $gcc -or -not (Test-CC $gcc)) {
              $gcc = $null
              $cands = @()
              $onpath = Get-Command gcc -ErrorAction SilentlyContinue
              if ($onpath) { $cands += $onpath.Source }
              $cands += 'C:\mingw64\bin\gcc.exe'
              $cands += 'C:\tools\mingw64\bin\gcc.exe'
              foreach ($c in $cands) { if (Test-CC $c) { $gcc = $c; break } }
            }
            if (-not $gcc) { throw 'no usable x86_64-w64-mingw32 C compiler' }
            Write-Host "gcc: $gcc  target=$(& $gcc -dumpmachine)"
            if ((& $gcc -dumpmachine) -notmatch 'x86_64') {
              throw "compiler target is not x86_64: $(& $gcc -dumpmachine)"
            }

            # Git Bash does not treat a backslashed Windows path as a command
            # name; forward slashes work in both bash and gcc.
            $env:CC = $gcc.Replace('\', '/')
            $bash = (Get-Command bash -ErrorAction SilentlyContinue).Source
            if (-not $bash) { throw 'no bash to run build-win64-deps.sh' }
            $depLog = "$env:RUNNER_TEMP\build-windows-x64-deps.log"
            # TCC and zlib are not tracked in the repo. fetch-3rd-party.sh
            # verifies the pinned SHA256 and unpacks them into src/3rd/.
            & $bash 'src/prj/fun/fetch-3rd-party.sh' '--win64-deps' *>&1 |
              Tee-Object -FilePath $depLog
            if ($LASTEXITCODE -ne 0) {
              $tail = ((Get-Content $depLog -Tail 20) -join ' | ')
              throw "fetch-3rd-party.sh exited $LASTEXITCODE :: $tail"
            }
            & $bash 'src/prj/fun/build-win64-deps.sh' *>&1 |
              Tee-Object -FilePath $depLog -Append
            if ($LASTEXITCODE -ne 0) {
              $tail = ((Get-Content $depLog -Tail 20) -join ' | ')
              throw "build-win64-deps.sh exited $LASTEXITCODE :: $tail"
            }
            foreach ($dll in @('libtcc.dll', 'zlib.dll')) {
              $p = Join-Path $env:GITHUB_WORKSPACE "src\prj\fun\$dll"
              if (-not (Test-Path $p)) { throw "$dll was not produced" }
              Write-Host "built $p ($((Get-Item $p).Length) bytes)"
            }
            Write-Host "::warning title=win64 runtime DLLs ok::libtcc.dll + zlib.dll are x86_64"
          } catch {
            Write-Host "::warning title=win64 runtime DLLs::$($_.Exception.Message)"
          }
          $global:LASTEXITCODE = 0

      - name: Check win64 runtime DLLs
        id: win64-runtime-present
        shell: pwsh
        run: |
          $ok = (Test-Path 'src\prj\fun\libtcc.dll') -and (Test-Path 'src\prj\fun\zlib.dll')
          "ok=$($ok.ToString().ToLower())" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Save win64 runtime DLLs
        if: steps.cache-win64-runtime.outputs.cache-hit != 'true' && steps.win64-runtime-present.outputs.ok == 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            src\prj\fun\libtcc.dll
            src\prj\fun\zlib.dll
          key: win64-runtime-tcc-0.9.27-zlib-1.2.11-v1-${{ steps.src-hash.outputs.value }}

      - name: Build funcmd.exe
        if: steps.cache-funcmd-win.outputs.cache-hit != 'true'
        working-directory: src\prj\fun
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\build-windows-x64.log"
          # Call the x86_64-win64 compiler directly, as make-win64.bat does: the
          # generic fpc.exe driver is the i386 one here and forwards -Twin64 to
          # ppc386.exe ("Illegal parameter: -Twin64").
          #
          # Optional capabilities come from the DLLs the step above placed next
          # to this exe: -dRegex -dPCRE_WinDLL for PCRE (pcre3.dll) and -dWinFFI
          # for getapi (ffi.dll, FPC's bundled libffi unit). Each is tried and
          # dropped on failure, so a missing DLL degrades instead of failing.
          #
          # -Fu..\..\lib is for lffi: funcmd.dpr lists host with an explicit
          # `in` path, but a unit that host pulls in itself (lffi, under
          # UnixFFI/-dWinFFI) is not on any search path without this.
          $sets = @()
          $caps = @()
          if ($env:FUN_PCRE_DLL) { $caps += @('-dRegex', '-dPCRE_WinDLL') }
          if ($env:FUN_FFI_DLL)  { $caps += @('-dWinFFI') }
          $sets += ,($caps)                       # everything available
          if ($caps.Count -gt 1) { $sets += ,($caps[0..($caps.Count-2)]) }  # drop WinFFI
          $sets += ,@()                           # core build

          # Splat one array instead of typing the flags inline: PowerShell's
          # native argument passing is what mangles a bare -Fu..\..\lib into
          # something fpc reads as a path plus a stray 'lib' source file.
          $argv = @('funcmd.dpr', '-B', '-Sd', '-O2', '-Ooregvar', '-Xs', '-Twin64',
                    '-dWin64', '-d_B_', '-d_C_', '-dWinCOMx',
                    '-dFunPack',
                    "-Fu$((Resolve-Path '..\..\lib').Path)")
          # Keep the normal build's .ppu/.o/.obj out of the project directory:
          # the safe build uses units-safe, and stale normal units in the
          # current directory have confused the win64 compiler before.
          $units = Join-Path (Get-Location) 'units'
          New-Item -ItemType Directory -Force -Path $units | Out-Null
          Remove-Item (Join-Path $units '*.ppu'), (Join-Path $units '*.o'), `
                      (Join-Path $units '*.or') -Force -ErrorAction SilentlyContinue
          $argv += "-FU$units"

          $built = $null
          $tried = @()
          foreach ($v in $sets) {
            $label = if ($v.Count -eq 0) { 'no optional features' } else { $v -join ' ' }
            $pa = $argv + $v
            Write-Host "argv: $(($pa | ForEach-Object { "[$_]" }) -join ' ')"
            & ppcrossx64 @pa *>&1 |
              Tee-Object -FilePath $log
            if ($LASTEXITCODE -eq 0) { $built = $label; break }
            $err = (Get-Content $log |
                      Select-String -Pattern 'Fatal:|Error:' |
                      Select-Object -Last 6 |
                      ForEach-Object { $_.Line }) -join ' | '
            if ([string]::IsNullOrEmpty($err)) { $err = "fpc exited $LASTEXITCODE with no Fatal:/Error: line" }
            $tried += "[$label] $err"
            Write-Host "::warning title=build attempt failed::$label :: $err"
          }
          if (-not $built) {
            $all = ($tried -join ' ;; ')
            Write-Host "::error title=build (windows-x64)::$($all.Substring(0, [Math]::Min(900, $all.Length)))"
            exit 1
          }
          # visible from outside: which optional features this build carries
          Write-Host "::warning title=build (windows-x64) flags::[$built]"
          "FUN_WIN_BUILD_LABEL=$built" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Cached next to the exe so a cache hit can still report capabilities.
          # This step runs in src\prj\fun, so keep the path relative to it.
          $built | Out-File -FilePath 'funcmd.flags.txt' -Encoding ascii

      - name: Build funcmd-safe.exe
        if: steps.cache-funcmd-win.outputs.cache-hit != 'true'
        working-directory: src\prj\fun
        shell: pwsh
        run: |
          # Same compiler and optional features as funcmd.exe, plus -dFunSafe.
          # This is a separate binary so the default interpreter and its
          # regression baseline are unchanged. The unit cache is separate: a
          # safe build must never reuse normal .ppu files (or vice versa).
          $log = "$env:RUNNER_TEMP\build-windows-x64-safe.log"
          # Reuse the exact optional-feature set the normal build just proved
          # it can link. funcmd.flags.txt holds the label; the core fallback
          # is the human-readable string "no optional features".
          $flags = @()
          if (Test-Path 'funcmd.flags.txt') {
            $label = (Get-Content 'funcmd.flags.txt' -Raw).Trim()
            if ($label -and $label -ne 'no optional features') {
              $flags = @($label -split '\s+' | Where-Object { $_ })
            }
          }
          $units = Join-Path (Get-Location) 'units-safe'
          New-Item -ItemType Directory -Force -Path $units | Out-Null
          Remove-Item (Join-Path $units '*.ppu'), (Join-Path $units '*.o'), `
                      (Join-Path $units '*.or') -Force -ErrorAction SilentlyContinue
          $argv = @('funcmd.dpr', '-B', '-Sd', '-O2', '-Ooregvar', '-Xs', '-Twin64',
                    '-dWin64', '-d_B_', '-d_C_', '-dWinCOMx', '-dFunPack') + $flags +
                  @('-dFunSafe', '-ofuncmd-safe.exe', "-FU$units",
                    "-Fu$((Resolve-Path '..\..\lib').Path)")
          Write-Host "safe argv: $(($argv | ForEach-Object { "[$_]" }) -join ' ')"
          "safe argv: $(($argv | ForEach-Object { "[$_]" }) -join ' ')" |
            Out-File -FilePath $log -Encoding ascii
          & ppcrossx64 @argv *>&1 | Tee-Object -FilePath $log -Append
          if ($LASTEXITCODE -ne 0) {
            $errs = (Get-Content $log |
                       Select-String -Pattern 'Fatal:|Error:' |
                       Select-Object -Last 8 |
                       ForEach-Object { $_.Line }) -join ' | '
            if ([string]::IsNullOrEmpty($errs)) {
              $errs = ((Get-Content $log -Tail 20) -join ' | ')
            }
            Write-Host "::error title=safe build (windows-x64)::exit=$LASTEXITCODE $errs"
            exit 1
          }
          if (-not (Test-Path 'funcmd-safe.exe')) {
            Write-Host "::error title=safe build (windows-x64)::ppcrossx64 succeeded but funcmd-safe.exe is missing"
            exit 1
          }
          Write-Host "::warning title=safe build (windows-x64) ok::funcmd-safe.exe=$((Get-Item 'funcmd-safe.exe').Length) bytes"

      - name: Build fun-jsbox.exe (MSVC)
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vs = & $vswhere -latest -products * `
                  -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
                  -property installationPath
          if (-not $vs) { throw "Visual Studio C++ tools not found" }
          $vcvars = Join-Path $vs "VC\Auxiliary\Build\vcvars64.bat"
          cmd /c "call `"$vcvars`" >nul && powershell -NoProfile -ExecutionPolicy Bypass -File src\prj\fun\build-jsbox.ps1"
          if ($LASTEXITCODE -ne 0) { throw "build-jsbox.ps1 failed: $LASTEXITCODE" }
          if (-not (Test-Path 'fun\fun-jsbox.exe')) { throw "fun-jsbox.exe missing" }
          Write-Host "::warning title=jsbox build::fun-jsbox.exe=$((Get-Item 'fun\fun-jsbox.exe').Length) bytes"

      - name: jsbox sandbox regression (Windows)
        shell: pwsh
        run: |
          $label = if (Test-Path 'src\prj\fun\funcmd.flags.txt') {
            (Get-Content 'src\prj\fun\funcmd.flags.txt' -Raw).Trim()
          } else { '' }
          if ($label -notmatch 'WinFFI') {
            Write-Host "::warning title=jsbox regression (windows-x64)::skipped: funcmd.exe has no WinFFI"
            exit 0
          }
          $env:FUN_JSBOX = (Resolve-Path 'fun\fun-jsbox.exe').Path
          $exe = "$env:GITHUB_WORKSPACE\src\prj\fun\funcmd.exe"
          $out = & $exe 'fun\test\jsbox_test.fun' 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) { throw "jsbox tests exited $LASTEXITCODE" }
          $sum = ($out | Select-String -Pattern '# tests:' | Select-Object -Last 1).Line
          if (-not $sum -or $sum -notmatch 'failed: 0') { throw "jsbox tests did not pass: $sum" }
          Write-Host "::warning title=jsbox regression (windows-x64)::$sum"

      - name: Capability probes
        shell: pwsh
        run: |
          # Which optional features the build actually has, visible from outside
          # (the job log is not). Same regex probe the runner uses, plus getapi
          # (win64 reaches it through ffi.dll and -dWinFFI).
          $exe = "$env:GITHUB_WORKSPACE\src\prj\fun\funcmd.exe"
          $probes = @{
            regex  = @("var r = 'a1b2'.replace(/\d++/g, '-');",
                       "if r = 'a-b-' then ?. 'on'; else ?. 'off'; end if;")
            # a getapi() result object is falsy in Fun, so call it: a value
            # means the signature worked, not just that the symbol resolved
            getapi = @("var f = 'kernel32'.getapi('GetTickCount', ':i');",
                       "var t = f();",
                       "if t > 0 then ?. 'on'; else ?. 'off'; end if;")
          }
          foreach ($name in $probes.Keys) {
            $f = "$env:RUNNER_TEMP\probe-$name.fun"
            ($probes[$name]) -join "`n" | Out-File -FilePath $f -Encoding ascii
            $out = & $exe $f 2>&1
            Write-Host "::warning title=probe $name::exit=$LASTEXITCODE out=[$($out -join '~')]"
          }
          # purely diagnostic: a probe that says 'off' or errors is a finding,
          # not a regression, so never let it fail the job
          $global:LASTEXITCODE = 0

      - name: Regression (portable subset)
        shell: pwsh
        run: |
          # The shared snapshots are kept CRLF for this runner (POSIX `?.` now
          # emits LF, and the POSIX runner compares with line endings
          # normalized). Their last line ends with a lone CR because the old
          # POSIX capture dropped the trailing LF. A Windows redirect keeps
          # that final LF, so re-add exactly one "\n" (verified against every
          # shared snapshot) instead of rewriting line endings - the snapshots
          # are already CRLF.
          #
          # Copy bytes, not text: some snapshots (set-named.fun) carry raw
          # non-UTF-8 bytes, and ReadAllText/WriteAllText would decode and
          # re-encode them (U+FFFD), so the copy would no longer match.
          $expSrc = "fun\test\expected"
          $expDst = "$env:RUNNER_TEMP\expected-win"
          Remove-Item -Recurse -Force $expDst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $expDst | Out-Null
          Get-ChildItem "$expSrc\*.txt" | ForEach-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            if ($b.Length -gt 0 -and $b[$b.Length - 1] -eq 13) { $b += [byte]10 }
            [IO.File]::WriteAllBytes((Join-Path $expDst $_.Name), $b)
          }
          $env:FUNREG_EXPECTED = $expDst

          $log = "$env:RUNNER_TEMP\reg-windows-x64.log"
          cmd /c "fun\test\run-windows-regression.bat --portable" 2>&1 |
            Tee-Object -FilePath $log
          # visible from outside on success too: N/M checks passed (skipped K)
          $sum = (Get-Content $log | Select-String -Pattern 'checks passed' |
                    Select-Object -Last 1 | ForEach-Object { $_.Line.Trim() })
          Write-Host "::warning title=regression (windows-x64) summary::$sum"
          if ($LASTEXITCODE -ne 0) {
            # Surface the failing tests and the runner's own diff lines: the job
            # log is not readable from outside, so an annotation is the only view.
            $head = (Get-Content $log | Select-Object -First 45 | ForEach-Object { $_ }) -join '~'
            Write-Host "::warning title=regression (windows-x64) head::$($head.Substring(0, [Math]::Min(2500, $head.Length)))"

            # Lengths + first differing byte for the first few failures: equal
            # lengths with a difference means line endings, unequal means content.
            $line = Get-Content $log
            $pairs = @(); $g = $null
            foreach ($l in $line) {
              if ($l -match '^\s*got:\s*(.+)$') { $g = $Matches[1].Trim() }
              elseif ($l -match '^\s*exp:\s*(.+)$' -and $g) { $pairs += , @($g, $Matches[1].Trim()); $g = $null }
            }
            $rep = @()
            foreach ($p in ($pairs | Select-Object -First 12)) {
              if ((Test-Path $p[0]) -and (Test-Path $p[1])) {
                $a = [IO.File]::ReadAllBytes($p[0]); $b = [IO.File]::ReadAllBytes($p[1])
                $n = [Math]::Min($a.Length, $b.Length); $d = -1
                for ($i = 0; $i -lt $n; $i++) { if ($a[$i] -ne $b[$i]) { $d = $i; break } }
                $rep += "$([IO.Path]::GetFileNameWithoutExtension($p[1])): got=$($a.Length) exp=$($b.Length) diff@$d"
              }
            }
            Write-Host "::warning title=regression (windows-x64) sizes::$($rep -join ' | ')"

            $fails = (Get-Content $log |
                        Select-String -Pattern 'FAIL|failed|mismatch|not found|error' |
                        Select-Object -First 40 |
                        ForEach-Object { $_.Line }) -join ' | '
            if ([string]::IsNullOrEmpty($fails)) { $fails = "runner exited $LASTEXITCODE" }
            Write-Host "::error title=regression (windows-x64)::$($fails.Substring(0, [Math]::Min(900, $fails.Length)))"
            exit 1
          }

      - name: Safe capability regression (strict)
        shell: pwsh
        run: |
          if (-not (Test-Path 'src\prj\fun\funcmd-safe.exe') -and
              -not (Test-Path 'fun\funcmd-safe.exe')) {
            Write-Host "::error title=safe regression (windows-x64)::funcmd-safe.exe is missing"
            exit 1
          }
          $out = cmd /c "fun\test\run-safe-regression.bat strict" 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $fails = ($out | Select-String -Pattern 'not ok|FAIL|failed|safe regression|Error' |
                        Select-Object -Last 20 | ForEach-Object { $_.Line }) -join ' | '
            if ([string]::IsNullOrEmpty($fails)) { $fails = "runner exited $LASTEXITCODE" }
            Write-Host "::error title=safe regression (windows-x64)::$fails"
            exit $LASTEXITCODE
          }

      - name: Runtime C and zlib probes (win64)
        shell: pwsh
        run: |
          # File presence is not proof: the DLL must be x86_64 and its ABI
          # must match the bindings. Record the result for the stage step and
          # drop a DLL that cannot be used, so capabilities.json and the
          # archive tell the same story.
          $exe = "$env:GITHUB_WORKSPACE\src\prj\fun\funcmd.exe"
          function Run-Probe([string]$name, [string[]]$lines) {
            $f = "$env:RUNNER_TEMP\probe-$name.fun"
            $lines -join "`n" | Out-File -FilePath $f -Encoding ascii
            $out = & $exe $f 2>&1
            Write-Host "::warning title=probe $name::exit=$LASTEXITCODE out=[$($out -join '~')]"
            return (($out | Select-Object -Last 1) -as [string]).Trim()
          }

          $tcc = Run-Probe 'tcc' @(
            "use 'fun/lib/lib-tcc.fun';",
            "try",
            "  var f = ccompile('int add(int a, int b) { return a + b; }', 'ii:i');",
            "  ?. f.call(3, 4); f.del();",
            "except",
            "  ?. 'off';",
            "end try;")
          $zlib = Run-Probe 'zlib' @(
            "use 'fun/lib/lib-zlib.fun';",
            "var ok = false;",
            "try",
            "  ok = decompress(compress('win64 zlib'), 64) = 'win64 zlib'",
            "       and inflate(deflate('win64 zlib')) = 'win64 zlib';",
            "except",
            "  ok = false;",
            "end try;",
            "if ok then ?. 'on'; else ?. 'off'; end if;")
          if ($tcc -eq '7') { "FUN_WIN_TCC=1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          else {
            "FUN_WIN_TCC=0" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            Remove-Item 'src\prj\fun\libtcc.dll' -Force -ErrorAction SilentlyContinue
          }
          if ($zlib -eq 'on') { "FUN_WIN_ZLIB=1" | Out-File $env:GITHUB_ENV -Append -Encoding utf8 }
          else {
            "FUN_WIN_ZLIB=0" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
            Remove-Item 'src\prj\fun\zlib.dll' -Force -ErrorAction SilentlyContinue
          }
          $global:LASTEXITCODE = 0

      # Same contract as the POSIX jobs: only a green main run produces a
      # release stage, and the release workflow downloads it instead of
      # rebuilding. The label recorded by the build step says which optional
      # features were compiled in; the DLL checks record what can be shipped.
      - name: Stage release build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: pwsh
        run: |
          $stage = "$env:GITHUB_WORKSPACE\dist-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item 'src\prj\fun\funcmd.exe' $stage -Force
          if (Test-Path 'src\prj\fun\funcmd-safe.exe') {
            Copy-Item 'src\prj\fun\funcmd-safe.exe' $stage -Force
          }
          foreach ($dll in @('pcre3.dll', 'ffi.dll', 'libtcc.dll', 'zlib.dll')) {
            if (Test-Path "src\prj\fun\$dll") { Copy-Item "src\prj\fun\$dll" $stage -Force }
          }

          $label = if (Test-Path 'src\prj\fun\funcmd.flags.txt') {
            (Get-Content 'src\prj\fun\funcmd.flags.txt' -Raw).Trim()
          } else { [string]$env:FUN_WIN_BUILD_LABEL }
          $tccOk  = ($env:FUN_WIN_TCC -eq '1')
          $zlibOk = ($env:FUN_WIN_ZLIB -eq '1')
          $caps = [ordered]@{
            platform       = 'win-x64'
            commit_sha     = $env:GITHUB_SHA
            tag            = ''
            build_flags    = @($label -split '\s+' | Where-Object { $_ })
            regex          = ($label -match 'dRegex')
            ffi            = ($label -match 'dWinFFI')
            tcc            = $tccOk
            # lib-asm / lib-asm-pro are pure Fun plus VirtualAlloc; a win64
            # build carries the x86-64 backend, so the machine-code layer is
            # available whenever the interpreter itself is.
            asm            = $true
            safe           = (Test-Path 'src\prj\fun\funcmd-safe.exe')
            safe_level     = 'strict'
            libtcc_present = $tccOk
            zlib_present   = $zlibOk
            notes          = ''
          }
          $missing = @()
          if (-not $caps.regex) { $missing += 'regex unavailable (PCRE DLL not built)' }
          if (-not $caps.ffi) { $missing += 'getapi/FFI unavailable' }
          if (-not $caps.tcc) { $missing += 'runtime C compile unavailable (libtcc.dll missing or unusable)' }
          if (-not $caps.zlib_present) { $missing += 'zlib unavailable (zlib.dll missing or unusable)' }
          if (-not $caps.safe) { $missing += 'safe build not provided on win-x64' }
          $caps.notes = ($missing -join '; ')
          Write-Host "::warning title=win stage::safe=$($caps.safe) tcc=$($caps.tcc) regex=$($caps.regex) ffi=$($caps.ffi)"
          ($caps | ConvertTo-Json -Depth 5) |
            Out-File -FilePath "$stage\build-env.json" -Encoding utf8
          Get-ChildItem $stage | ForEach-Object { Write-Host "staged: $($_.Name)" }

      - name: Upload release stage
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: fun-stage-win-x64
          path: dist-stage/
          retention-days: 90
          if-no-files-found: error

  # windows-arm64 is temporarily disabled: FPC 3.2.2 (the pinned toolchain) has
  # no win64/aarch64 target, so there is nothing to build with and the job could
  # only ever fail. Re-enable it together with an FPC >= 3.3.x that ships the
  # aarch64-windows target (and a win64/aarch64 host runner).
