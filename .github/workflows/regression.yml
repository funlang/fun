# Continuous integration: build the interpreter and run the regression suite
# on five platforms - Linux / macOS / Windows, x64 for each, arm64 for the
# two where an FPC target exists.
#
#   linux-x64    ubuntu-24.04      native FPC + full suite
#   linux-arm64  ubuntu-24.04-arm  native FPC + full suite (linux-aarch64 skips)
#   macos-x64    macos-15-intel    FPC universal dmg + macOS suite
#   macos-arm64  macos-latest      Homebrew FPC 3.2.2 bottle + macOS suite
#   windows-x64  windows-latest    FPC (ppcrossx64) + the Windows runner (portable subset)
#
# windows-arm64 is disabled: FPC 3.2.2 has no win64/aarch64 target, so there is
# no toolchain to build with (see the commented-out job at the end of the file;
# re-enable it when a >= 3.3.x FPC with aarch64-windows support is pinned).
#
# The POSIX runner auto-detects the host and reads a per-platform skip list
# (fun/test/regression-skip-<platform>.txt) plus optional
# fun/test/expected/<platform>/ snapshots; see fun/test/run-linux-regression.sh
# and art/notes/macos-port.md.
#
# Status: all five jobs are a gate. The Windows build still has no regex (no
# PCRE is compiled there yet), so run-windows-regression.bat probes for the
# engine and skips the regex-dependent tests accordingly; the remaining
# host-dependent entries are listed there too. See the README "Regression tests
# and CI" section.
name: regression

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

# Cancel an in-progress run when the same ref is pushed again.
concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- POSIX ---
  unix:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-24.04
            platform: linux
            fpc_tar: fpc-3.2.2.x86_64-linux.tar
            build: ./make-linux-x86_64.sh
            fetch_all: true
          - name: linux-arm64
            os: ubuntu-24.04-arm
            platform: linux-aarch64
            fpc_tar: fpc-3.2.2.aarch64-linux.tar
            build: ./make-linux-x86_64.sh
            fetch_all: true
          - name: macos-x64
            os: macos-15-intel
            platform: macos
            fpc_tar: ""
            build: ./make-macos.sh
            fetch_all: false
          - name: macos-arm64
            os: macos-latest
            platform: macos-aarch64
            fpc_tar: ""
            build: ./make-macos.sh
            fetch_all: false
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Cache Free Pascal (Linux)
        if: runner.os == 'Linux'
        id: cache-fpc
        uses: actions/cache@v4
        with:
          path: |
            ~/fpc-3.2.2
            ~/.fpc.cfg
          key: ${{ matrix.fpc_tar }}

      - name: Install Free Pascal 3.2.2 (Linux)
        if: runner.os == 'Linux' && steps.cache-fpc.outputs.cache-hit != 'true'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL --retry 3 -o fpc.tar \
            "https://downloads.sourceforge.net/project/freepascal/Linux/3.2.2/${{ matrix.fpc_tar }}"
          mkdir -p fpc && tar -xf fpc.tar -C fpc
          cd fpc/fpc-3.2.2.*-linux
          # install.sh is interactive: first line is the prefix, the rest accept
          # the defaults (install all unit packages, including libffi + hash).
          printf '%s\n\n\n\n\n\n\n\n\n\n' "$HOME/fpc-3.2.2" | ./install.sh

      - name: Put fpc on PATH (Linux)
        if: runner.os == 'Linux'
        run: echo "$HOME/fpc-3.2.2/bin" >> "$GITHUB_PATH"

      - name: Install OpenSSL (lib-crypto tests)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libssl-dev

      - name: Cache FPC installer dmg (macOS Intel)
        if: runner.os == 'macOS' && runner.arch == 'X64'
        uses: actions/cache@v4
        with:
          path: ~/fpc-cache
          key: fpc-dmg-3.2.2-intelarm64

      - name: Cache Homebrew downloads (macOS arm64)
        if: runner.os == 'macOS' && runner.arch == 'ARM64'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/Homebrew
          key: brew-downloads-${{ runner.arch }}

      - name: Install Free Pascal 3.2.2 (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          if [ "$(uname -m)" = "arm64" ]; then
            # Homebrew has an FPC 3.2.2 arm64 bottle (sequoia / tahoe / golden
            # gate). The official universal dmg, by contrast, is a PackageMaker
            # .mpkg that current macOS refuses ("This package is incompatible
            # with this version of macOS") and that pkgutil --expand cannot even
            # open, so use the bottle on Apple Silicon.
            brew install fpc
          else
            cd "$RUNNER_TEMP"
            # Intel runners have no Homebrew bottle for fpc, so use the official
            # universal dmg (fpc-3.2.2-intelarm64-macosx.mpkg), which installs
            # fine there. Cache the 274 MB download between runs.
            CACHE="$HOME/fpc-cache"; mkdir -p "$CACHE"
            if [ -f "$CACHE/fpc.dmg" ]; then
              cp -f "$CACHE/fpc.dmg" fpc.dmg
            else
              curl -fsSL --retry 5 --retry-all-errors --retry-delay 5 -o fpc.dmg \
                "https://downloads.sourceforge.net/project/freepascal/Mac%20OS%20X/3.2.2/fpc-3.2.2.intelarm64-macosx.dmg"
              cp -f fpc.dmg "$CACHE/fpc.dmg"
            fi
            ls -l fpc.dmg
            MOUNT="$RUNNER_TEMP/fpcmnt"
            mkdir -p "$MOUNT"
            if ! hdiutil attach fpc.dmg -nobrowse -mountpoint "$MOUNT"; then
              echo "::error title=macos fpc install::hdiutil attach failed"; exit 1
            fi
            # The dmg layout (volume root vs a wrapper folder, package at any
            # depth) varies, so locate the package instead of hard-coding it.
            # FPC's package is not notarized, so allow it explicitly.
            PKG="$(find "$MOUNT" \( -name '*.mpkg' -o -name '*.pkg' \) | head -n 1)"
            [ -n "$PKG" ] || { echo "::error title=macos fpc install::no package in the dmg"; exit 1; }
            echo "installing $PKG on macOS $(sw_vers -productVersion) $(uname -m)"
            out="$(sudo installer -pkg "$PKG" -target / -allowUntrusted 2>&1)" || {
              echo "::error title=macos fpc install::installer failed: $(printf '%s' "$out" | tail -n 3 | tr '\n' '~' | cut -c1-500)"
              exit 1
            }
            hdiutil detach "$MOUNT" || true
          fi
          fpc -iV || { echo "::error title=macos fpc install::fpc not on PATH after install"; exit 1; }

      - name: Link OpenSSL (lib-crypto tests)
        if: runner.os == 'macOS'
        run: brew link --force --overwrite openssl@3 || brew install openssl@3

      - name: Fetch third-party C sources
        run: |
          if [ "${{ matrix.fetch_all }}" = "true" ]; then
            src/prj/fun/fetch-3rd-party.sh
          else
            src/prj/fun/fetch-3rd-party.sh --pcre-only
          fi

      - name: Build funcmd
        working-directory: src/prj/fun
        run: |
          log="$RUNNER_TEMP/build-${{ matrix.name }}.log"
          if ! ${{ matrix.build }} >"$log" 2>&1; then
            tail -n 40 "$log"
            # Show the real error: the lines just above FPC's Fatal summary.
            err="$(grep -B8 -m1 -E 'Fatal: There were|Fatal: Compilation|Error:' "$log" | tr '\n' '|' | cut -c1-900)"
            echo "::error title=build (${{ matrix.name }})::$err"
            exit 1
          fi
          tail -n 5 "$log"

      - name: Regression
        env:
          FUNREG_PLATFORM: ${{ matrix.platform }}
        run: fun/test/run-linux-regression.sh

  # -------------------------------------------------------------- WINDOWS ---
  windows-x64:
    name: windows-x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Restore FPC cache (Windows)
        id: cache-fpc-win
        uses: actions/cache/restore@v4
        with:
          path: C:\FPC
          key: fpc-3.2.2-win64-and-cross

      - name: Install Free Pascal 3.2.2 (win32 + win64)
        if: steps.cache-fpc-win.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          try {
            # curl.exe follows the SourceForge redirect to the actual mirror;
            # Invoke-WebRequest has saved an HTML page here (corrupt .exe).
            # /TYPE=full selects every component, including the win64 compiler:
            # a bare /VERYSILENT install has laid down only bin\i386-win32.
            function Install-Fpc([string]$url, [string]$exe, [string]$label) {
              curl.exe -fL --retry 3 --retry-all-errors -o $exe $url
              if ($LASTEXITCODE -ne 0) { throw "$label curl failed ($LASTEXITCODE)" }
              $sz = (Get-Item $exe).Length
              Write-Host "$label downloaded $sz bytes"
              if ($sz -lt 1000000) { throw "$label download too small ($sz bytes) - not a PE" }
              $p = Start-Process -FilePath $exe -PassThru -Wait `
                -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART", "/SP-", "/TYPE=full", "/DIR=C:\FPC\3.2.2"
              Write-Host "$label installer exit code: $($p.ExitCode)"
            }

            # FPC has no separate win64 installer; the combined win32+win64 one
            # carries both targets (see the layout annotation below for how it
            # actually lays them out).
            Install-Fpc "https://downloads.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.win32.and.win64.exe" "$env:RUNNER_TEMP\fpc.exe" "combined"
            # Any of these means the win64 target came with the combined install.
            $win64Evidence = { (Test-Path "C:\FPC\3.2.2\bin\x86_64-win64\fpc.exe") -or
                               (Test-Path "C:\FPC\3.2.2\bin\i386-win32\ppcrossx64.exe") -or
                               (Test-Path "C:\FPC\3.2.2\units\x86_64-win64") }
            for ($i = 0; $i -lt 60 -and -not (& $win64Evidence); $i++) { Start-Sleep -Seconds 2 }

            if (-not (& $win64Evidence)) {
              # The combined installer did not lay down the win64 target, so add
              # fpc-3.2.2.i386-win32.cross.x86_64-win64.exe, which is exactly the
              # win64 target (ppcrossx64 + the x86_64-win64 units).
              Write-Host "no win64 target after the combined install; adding the cross package"
              Install-Fpc "https://downloads.sourceforge.net/project/freepascal/Win32/3.2.2/fpc-3.2.2.i386-win32.cross.x86_64-win64.exe" "$env:RUNNER_TEMP\fpcx.exe" "cross"
              for ($i = 0; $i -lt 60 -and -not (& $win64Evidence); $i++) { Start-Sleep -Seconds 2 }
            }

          } catch {
            Write-Host "::error title=windows fpc install::$($_.Exception.Message)"
            throw
          }

      - name: Put FPC on PATH (Windows)
        shell: pwsh
        run: |
          # Runs for both a fresh install and a cache restore: PATH itself is not
          # cached, and this also validates that the cache held a usable toolchain.
          # The combined installer ships the driver as bin\i386-win32\fpc.exe and
          # targets win64 through bin\i386-win32\ppcrossx64.exe plus the
          # x86_64-win64 units, so do not insist on an x86_64-win64\fpc.exe.
          $compilers = Get-ChildItem C:\FPC -Recurse -Filter fpc.exe -ErrorAction SilentlyContinue
          $fpc = $compilers | Where-Object { $_.FullName -match 'x86_64-win64' } | Select-Object -First 1
          if (-not $fpc) { $fpc = $compilers | Select-Object -First 1 }
          if (-not $fpc) { throw "no fpc.exe under C:\FPC (install or cache restore failed)" }

          # Surface the layout as an annotation: the log itself is not readable
          # from outside, and the win64 arrangement is what bring-up needs.
          $bins = @(Get-ChildItem C:\FPC -Recurse -Include 'fpc.exe', 'pp*.exe' -ErrorAction SilentlyContinue |
                      ForEach-Object { $_.FullName }) -join '; '
          $units = @(Get-ChildItem C:\FPC -Recurse -Directory -ErrorAction SilentlyContinue |
                      Where-Object { $_.FullName -match '[\\/]units' } |
                      ForEach-Object { $_.FullName }) -join '; '
          Write-Host "::warning title=windows fpc layout::compilers=[$bins] units=[$units]"

          $dirs = @($fpc.Directory.FullName)
          $dirs += @($compilers | ForEach-Object { $_.Directory.FullName } |
            Sort-Object -Unique | Where-Object { $_ -ne $fpc.Directory.FullName })
          foreach ($d in $dirs) {
            Write-Host "PATH += $d"
            $d | Out-File -FilePath $env:GITHUB_PATH -Append
          }
          & $fpc.FullName -iV

      - name: Save FPC cache (Windows)
        # actions/cache only saves on a successful job, and this job still fails
        # on the bring-up tests, so save explicitly - before the build/regression
        # steps, while everything above has succeeded (a failed install never
        # poisons the cache).
        if: steps.cache-fpc-win.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: C:\FPC
          key: fpc-3.2.2-win64-and-cross

      - name: Build pcre3.dll for win64 (regex, best effort)
        working-directory: src\prj\fun
        shell: pwsh
        run: |
          # The win64 build had no regex because nothing compiled PCRE there.
          # Build it as a DLL and let the Pascal side import from it
          # (-dPCRE_WinDLL): linking the MinGW objects straight into funcmd needs
          # the MinGW CRT resolved, which neither of FPC's linkers manages here
          # (the internal one names imports after the declaration; the external
          # one finds no member for __imp_isupper/malloc/... in
          # libucrt/libmsvcrt/libmingwex). GCC links the DLL itself, so the CRT
          # is its own problem, and FPC generates the import table from the DLL
          # name alone. Art.notes port-decisions D27 has the full story.
          #
          # Best effort: on failure the build runs without -dRegex and the
          # runner reports the regex tests as SKIP.
          $ErrorActionPreference = 'Stop'
          $src = Join-Path $env:GITHUB_WORKSPACE 'src\3rd\pcre-8'
          try {
            if (-not (Test-Path (Join-Path $src 'pcre_compile.c'))) {
              $tmp = Join-Path $env:RUNNER_TEMP 'pcre'
              New-Item -ItemType Directory -Force -Path $tmp | Out-Null
              $tar = Join-Path $tmp 'pcre-8.45.tar.gz'
              curl.exe -fsSL --retry 3 --retry-all-errors -o $tar `
                'https://downloads.sourceforge.net/project/pcre/pcre/8.45/pcre-8.45.tar.gz'
              if ($LASTEXITCODE -ne 0) { throw "download failed ($LASTEXITCODE)" }
              tar.exe -xf $tar -C $tmp
              New-Item -ItemType Directory -Force -Path (Split-Path $src) | Out-Null
              Move-Item (Join-Path $tmp 'pcre-8.45') $src
            }
            Copy-Item (Join-Path $src 'config.h.generic') (Join-Path $src 'config.h') -Force
            Copy-Item (Join-Path $src 'pcre.h.generic') (Join-Path $src 'pcre.h') -Force
            Copy-Item (Join-Path $src 'pcre_chartables.c.dist') (Join-Path $src 'pcre_chartables.c') -Force

            # the runner's gcc on PATH has no reachable C headers; this one does
            function Test-CC([string]$exe) {
              if (-not (Test-Path $exe)) { return $false }
              $o = Join-Path $env:RUNNER_TEMP 'cctest.o'
              Remove-Item -Force $o -ErrorAction SilentlyContinue
              'int main(void){return 0;}' | & $exe -c -x c - -o $o 2>&1 | Out-Null
              return (($LASTEXITCODE -eq 0) -and (Test-Path $o))
            }
            $cands = @()
            $onpath = Get-Command gcc -ErrorAction SilentlyContinue
            if ($onpath) { $cands += $onpath.Source }
            $cands += 'C:\mingw64\bin\gcc.exe'
            $cands += 'C:\tools\mingw64\bin\gcc.exe'
            $gcc = $null
            foreach ($c in $cands) {
              if (Test-CC $c) { $gcc = $c; break }
              Write-Host "not usable as a C compiler: $c"
            }
            if (-not $gcc) { throw 'no usable C compiler (tried PATH gcc, C:\mingw64)' }
            Write-Host "gcc: $gcc  target=$(& $gcc -dumpmachine)"

            $lib = Join-Path $src 'win64-dll'
            Remove-Item -Recurse -Force $lib -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force -Path $lib | Out-Null
            # the 8-bit sources (pcre_default_tables.c is a dftables-generated
            # duplicate of pcre_chartables.c, so it is left out: linking both
            # would clash on _pcre_default_tables)
            $units = 'pcre_byte_order','pcre_chartables','pcre_compile','pcre_config',
                     'pcre_dfa_exec','pcre_exec','pcre_fullinfo','pcre_get','pcre_globals',
                     'pcre_maketables','pcre_newline','pcre_refcount','pcre_string_utils',
                     'pcre_study','pcre_tables','pcre_ucd','pcre_valid_utf8','pcre_version',
                     'pcre_xclass'
            foreach ($u in $units) {
              $c = Join-Path $src "$u.c"
              if (-not (Test-Path $c)) { throw "missing source $u.c" }
              $out = & $gcc -c -O2 -DHAVE_CONFIG_H -DSUPPORT_PCRE8 "-I$src" $c -o (Join-Path $lib "$u.o") 2>&1
              if ($LASTEXITCODE -ne 0) {
                throw "gcc failed: $u :: " + (($out | Select-Object -First 12) -join ' ~ ')
              }
            }
            $dll = Join-Path (Join-Path $env:GITHUB_WORKSPACE 'src\prj\fun') 'pcre3.dll'
            $lo = & $gcc -shared -o $dll (Get-ChildItem (Join-Path $lib '*.o') | ForEach-Object { $_.FullName }) 2>&1
            if ($LASTEXITCODE -ne 0) {
              throw "gcc -shared failed :: " + (($lo | Select-Object -First 12) -join ' ~ ')
            }
            Write-Host "built $dll ($((Get-Item $dll).Length) bytes) next to funcmd.exe"
            "FUN_PCRE_DLL=1" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
            Write-Host "::warning title=pcre (win64) ok::gcc=$gcc ($(& $gcc -dumpmachine)); pcre3.dll=$((Get-Item $dll).Length) bytes"
          } catch {
            Write-Host "::warning title=pcre (win64)::$($_.Exception.Message)"
          }
          # best-effort: GitHub's pwsh wrapper exits with $LASTEXITCODE
          $global:LASTEXITCODE = 0

      - name: Build funcmd.exe
        working-directory: src\prj\fun
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP\build-windows-x64.log"
          # Call the x86_64-win64 compiler directly, as make-win64.bat does: the
          # generic fpc.exe driver is the i386 one here and forwards -Twin64 to
          # ppc386.exe ("Illegal parameter: -Twin64").
          #
          # -dRegex -dPCRE_WinDLL when the PCRE step above produced pcre3.dll
          # (next to funcmd.exe, where the loader finds it); otherwise the build
          # stays regex-less and the runner reports the regex tests as SKIP.
          $extra = @()
          if ($env:FUN_PCRE_DLL) {
            $extra = @('-dRegex', '-dPCRE_WinDLL')
            Write-Host "regex: -dRegex -dPCRE_WinDLL (pcre3.dll)"
          } else {
            Write-Host "regex: no pcre3.dll, building without -dRegex"
          }
          ppcrossx64 funcmd.dpr -B -Sd -O2 -Ooregvar -Xs -Twin64 -dWin64 -d_B_ -d_C_ -dWinCOMx @extra *>&1 |
            Tee-Object -FilePath $log
          # visible from outside: whether this build carries regex
          Write-Host "::warning title=build (windows-x64) flags::[$($extra -join ' ')]"
          if ($LASTEXITCODE -ne 0) {
            # Surface the real error: the log itself is not readable from outside.
            $err = (Get-Content $log |
                      Select-String -Pattern 'Fatal:|Error:' |
                      Select-Object -Last 6 |
                      ForEach-Object { $_.Line }) -join ' | '
            if ([string]::IsNullOrEmpty($err)) { $err = "fpc exited $LASTEXITCODE with no Fatal:/Error: line" }
            Write-Host "::error title=build (windows-x64)::$($err.Substring(0, [Math]::Min(900, $err.Length)))"
            exit 1
          }

      - name: Regression (portable subset)
        shell: pwsh
        run: |
          # Fun terminates lines with CRLF on every platform, and the POSIX
          # runner captures with $(...), which drops the trailing newline, so a
          # shared snapshot ends its last line with a lone CR. A Windows redirect
          # keeps that final LF, so re-add exactly one "\n" (verified against
          # every shared snapshot) instead of rewriting line endings - the
          # snapshots are already CRLF.
          #
          # Copy bytes, not text: some snapshots (set-named.fun) carry raw
          # non-UTF-8 bytes, and ReadAllText/WriteAllText would decode and
          # re-encode them (U+FFFD), so the copy would no longer match.
          $expSrc = "fun\test\expected"
          $expDst = "$env:RUNNER_TEMP\expected-win"
          Remove-Item -Recurse -Force $expDst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $expDst | Out-Null
          Get-ChildItem "$expSrc\*.txt" | ForEach-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            if ($b.Length -gt 0 -and $b[$b.Length - 1] -eq 13) { $b += [byte]10 }
            [IO.File]::WriteAllBytes((Join-Path $expDst $_.Name), $b)
          }
          $env:FUNREG_EXPECTED = $expDst

          $log = "$env:RUNNER_TEMP\reg-windows-x64.log"
          cmd /c "fun\test\run-windows-regression.bat --portable" 2>&1 |
            Tee-Object -FilePath $log
          # visible from outside on success too: N/M checks passed (skipped K)
          $sum = (Get-Content $log | Select-String -Pattern 'checks passed' |
                    Select-Object -Last 1 | ForEach-Object { $_.Line.Trim() })
          Write-Host "::warning title=regression (windows-x64) summary::$sum"
          if ($LASTEXITCODE -ne 0) {
            # Surface the failing tests and the runner's own diff lines: the job
            # log is not readable from outside, so an annotation is the only view.
            $head = (Get-Content $log | Select-Object -First 45 | ForEach-Object { $_ }) -join '~'
            Write-Host "::warning title=regression (windows-x64) head::$($head.Substring(0, [Math]::Min(2500, $head.Length)))"

            # Lengths + first differing byte for the first few failures: equal
            # lengths with a difference means line endings, unequal means content.
            $line = Get-Content $log
            $pairs = @(); $g = $null
            foreach ($l in $line) {
              if ($l -match '^\s*got:\s*(.+)$') { $g = $Matches[1].Trim() }
              elseif ($l -match '^\s*exp:\s*(.+)$' -and $g) { $pairs += , @($g, $Matches[1].Trim()); $g = $null }
            }
            $rep = @()
            foreach ($p in ($pairs | Select-Object -First 12)) {
              if ((Test-Path $p[0]) -and (Test-Path $p[1])) {
                $a = [IO.File]::ReadAllBytes($p[0]); $b = [IO.File]::ReadAllBytes($p[1])
                $n = [Math]::Min($a.Length, $b.Length); $d = -1
                for ($i = 0; $i -lt $n; $i++) { if ($a[$i] -ne $b[$i]) { $d = $i; break } }
                $rep += "$([IO.Path]::GetFileNameWithoutExtension($p[1])): got=$($a.Length) exp=$($b.Length) diff@$d"
              }
            }
            Write-Host "::warning title=regression (windows-x64) sizes::$($rep -join ' | ')"

            $fails = (Get-Content $log |
                        Select-String -Pattern 'FAIL|failed|mismatch|not found|error' |
                        Select-Object -First 40 |
                        ForEach-Object { $_.Line }) -join ' | '
            if ([string]::IsNullOrEmpty($fails)) { $fails = "runner exited $LASTEXITCODE" }
            Write-Host "::error title=regression (windows-x64)::$($fails.Substring(0, [Math]::Min(900, $fails.Length)))"
            exit 1
          }

  # windows-arm64 is temporarily disabled: FPC 3.2.2 (the pinned toolchain) has
  # no win64/aarch64 target, so there is nothing to build with and the job could
  # only ever fail. Re-enable it together with an FPC >= 3.3.x that ships the
  # aarch64-windows target (and a win64/aarch64 host runner).
  #
  # windows-arm64:
  #   name: windows-arm64
  #   runs-on: windows-11-arm
  #   continue-on-error: true   # see the step below: no aarch64-windows FPC yet
  #   steps:
