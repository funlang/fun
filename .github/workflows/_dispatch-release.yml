# Temporary bring-up helper: dispatch the release workflow once, from CI,
# after the regression run for this commit succeeds. Removed immediately after
# the first nightly is verified.
name: dispatch release (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_dispatch-release.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Wait for this commit's regression, then dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          trap 'echo "::error title=dispatch helper failed::line $LINENO: $BASH_COMMAND"' ERR
          gh --version
          echo "waiting for regression of $GITHUB_SHA"
          for i in $(seq 1 36); do
            json=$(gh run list --workflow=regression.yml --branch=main --limit 30 \
                     --json databaseId,headSha,status,conclusion)
            line=$(printf '%s' "$json" | python3 -c '
          import json, os, sys
          sha = os.environ["GITHUB_SHA"]
          runs = [r for r in json.load(sys.stdin) if r["headSha"] == sha]
          r = runs[0] if runs else {}
          print(str(r.get("databaseId", "")) + " " + str(r.get("status", "")) + " " + str(r.get("conclusion") or ""))
          ')
            echo "$(date -u +%H:%M:%S) $line"
            set -- $line
            [ "${3:-}" = "success" ] && break
            [ "${2:-}" = "completed" ] && { echo "regression did not succeed"; exit 1; }
            sleep 20
          done
          [ "${3:-}" = "success" ] || { echo "regression did not finish in time"; exit 1; }
          gh workflow run release.yml --ref main \
            --field channel=nightly --field force=false
          echo "release dispatched for $GITHUB_SHA"
