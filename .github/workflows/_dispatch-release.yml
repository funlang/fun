# Temporary: force one verification nightly through the new suffix logic.
# Removed after the release is verified.
name: dispatch release (temporary)

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/_dispatch-release.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Wait for this commit's regression, then dispatch release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          for i in $(seq 1 36); do
            line=$(gh run list --workflow=regression.yml --branch=main --limit 30 \
                     --json databaseId,headSha,status,conclusion |
                   jq -r --arg sha "$GITHUB_SHA" \
                     '[.[] | select(.headSha == $sha)][0] | "\(.databaseId) \(.status) \(.conclusion)"')
            echo "$(date -u +%H:%M:%S) $line"
            set -- $line
            [ "${3:-}" = "success" ] && break
            [ "${2:-}" = "completed" ] && { echo "regression did not succeed"; exit 1; }
            sleep 20
          done
          [ "${3:-}" = "success" ] || { echo "regression did not finish in time"; exit 1; }
          gh workflow run release.yml --ref main \
            --field channel=nightly --field force=true
          echo "release dispatched for $GITHUB_SHA"
