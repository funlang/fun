name: docs

# Lightweight gate for the master status document. It does not build Fun.
on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  roadmap:
    name: roadmap
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check ROADMAP.md
        run: sh src/prj/fun/check-roadmap.sh
      - name: Check README version
        run: |
          ver=$(sed -n "s/.*funRelease = '\([0-9][0-9.]*\)'.*/\1/p" src/core/version.inc | head -1)
          [ -n "$ver" ] || { echo "cannot read funRelease"; exit 1; }
          grep -q "Version: \*\*$ver\*\*" README.md || {
            echo "README.md Version line does not match $ver"; exit 1; }
          grep -q "版本：\*\*$ver\*\*" README.zh.md || {
            echo "README.zh.md version line does not match $ver"; exit 1; }
          echo "version references agree: $ver"
