# ============================================================
# winarm64.yml -- manual bring-up harness for Windows on arm64.
#
# NOT a release target. FPC 3.2.2 has no win64/aarch64 target, and while FPC
# 3.3.1 (trunk) does, every binary it produces -- its own compiler included --
# crashes with 0xC0000005 on real Windows arm64 hardware. The epilogue fix for
# upstream #42091 is applied below, but a bare `writeln('hello')` compiled with
# -O-, -O1 and -O2 still crashes, so the remaining fault is in FPC's RTL or
# codegen (upstream #42048 and friends), not in Fun.
#
# This workflow therefore runs on manual dispatch only and uploads no release
# stage. It keeps the cross-build path (FPC source on ubuntu-24.04, assembled
# through Zig's clang) and the native windows-11-arm test job ready so the
# target can be re-validated when FPC fixes the backend. Once it goes green,
# re-add the push trigger and the release.yml stage download.
#
# See `make-win-arm64.sh` and `win-arm64/clang` for the build itself.
# ============================================================
name: winarm64

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: winarm64-${{ github.ref }}
  cancel-in-progress: true

env:
  # FPC main is the branch with the win64/aarch64 backend. Pin the snapshot
  # validated with Zig 0.13; bump it deliberately after a green run.
  FPC_REF: 6c67b89328feca1cdfb9c63c23ed3f12976b071d
  ZIG_VERSION: 0.13.0
  TOOLCHAIN_ROOT: ${{ github.workspace }}/.winarm/fpc
  ZIG_ROOT: ${{ github.workspace }}/.winarm/zig

jobs:
  # --------------------------------------------------------------- BUILD ---
  build:
    name: build-win-arm64
    runs-on: ubuntu-24.04
    # Cold builds bootstrap the FPC cross compiler and its packages; warm runs
    # restore the toolchain cache (about 360 MB) and only compile funcmd.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Resolve the FPC source revision
        id: fpc
        run: |
          set -euo pipefail
          if printf '%s' "$FPC_REF" | grep -Eq '^[0-9a-f]{40}$'; then
            sha="$FPC_REF"
          else
            sha=$(git ls-remote https://github.com/fpc/FPCSource.git "refs/heads/$FPC_REF" | cut -f1)
          fi
          [ -n "$sha" ] || { echo "::error::cannot resolve FPC $FPC_REF"; exit 1; }
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "FPC $FPC_REF = $sha"

      - name: Cache the win64/aarch64 FPC cross toolchain
        id: cache-toolchain
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN_ROOT }}
          key: winarm-fpc-v2-${{ steps.fpc.outputs.sha }}

      - name: Cache Zig (assembler driver)
        id: cache-zig
        uses: actions/cache@v4
        with:
          path: ${{ env.ZIG_ROOT }}
          key: zig-${{ env.ZIG_VERSION }}-linux-x86_64

      - name: Install the host compiler for a cold toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq -o Acquire::Retries=3
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential fpc libncurses-dev python3

      - name: Install Zig
        if: steps.cache-zig.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p "$ZIG_ROOT"
          curl -fsSL "https://ziglang.org/download/$ZIG_VERSION/zig-linux-x86_64-$ZIG_VERSION.tar.xz" \
            -o "$RUNNER_TEMP/zig.tar.xz"
          tar xJf "$RUNNER_TEMP/zig.tar.xz" -C "$ZIG_ROOT" --strip-components=1

      - name: Bootstrap the FPC win64/aarch64 cross toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        env:
          FPC_SHA: ${{ steps.fpc.outputs.sha }}
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/fpc-src"
          rm -rf "$src"
          git init -q "$src"
          git -C "$src" remote add origin https://github.com/fpc/FPCSource.git
          git -C "$src" fetch --depth 1 origin "$FPC_SHA"
          git -C "$src" checkout -q FETCH_HEAD

          # The pinned revision still miscompiles frameless aarch64-win64
          # routines (FPC #42091), which makes every produced exe crash at
          # startup. Patch it before building the cross compiler; drop the
          # patch once FPC_REF includes the upstream fix.
          git -C "$src" apply "$GITHUB_WORKSPACE/src/prj/fun/patches/fpc-aarch64-win64-framepointer.patch" \
            || { echo "::error::cannot apply the aarch64-win64 framepointer patch"; exit 1; }

          boot=$(command -v ppcx64 || find /usr/lib/fpc -type f -name ppcx64 | head -n 1)
          [ -n "$boot" ] || { echo "::error::no boot ppcx64 (install fpc)"; exit 1; }

          # The aarch64-win64 backend assembles through <target>-clang. The
          # checked-in shim maps that to Zig's clang.
          tools="$RUNNER_TEMP/winarm-tools"
          mkdir -p "$tools"
          cp src/prj/fun/win-arm64/clang "$tools/clang"
          chmod +x "$tools/clang"
          ln -sf clang "$tools/aarch64-win64-clang"
          export PATH="$tools:$PATH"
          export ZIG="$ZIG_ROOT/zig"

          if ! make -C "$src" all OS_TARGET=win64 CPU_TARGET=aarch64 \
                 PP="$boot" -j"$(nproc)" > "$RUNNER_TEMP/fpc-all.log" 2>&1; then
            echo "::error title=fpc make all::$(grep -E 'Error|Fatal' "$RUNNER_TEMP/fpc-all.log" | tail -5 | tr '\n' '~')"
            tail -40 "$RUNNER_TEMP/fpc-all.log"
            exit 1
          fi
          if ! make -C "$src" crossinstall OS_TARGET=win64 CPU_TARGET=aarch64 \
                 PP="$boot" INSTALL_PREFIX="$TOOLCHAIN_ROOT" \
                 > "$RUNNER_TEMP/fpc-install.log" 2>&1; then
            echo "::error title=fpc crossinstall::$(grep -E 'Error|Fatal' "$RUNNER_TEMP/fpc-install.log" | tail -5 | tr '\n' '~')"
            tail -40 "$RUNNER_TEMP/fpc-install.log"
            exit 1
          fi

      # Save explicitly: actions/cache only saves at job end on success, and a
      # later compile failure should not force a full toolchain rebuild.
      - name: Save the FPC cross toolchain
        if: steps.cache-toolchain.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.TOOLCHAIN_ROOT }}
          key: winarm-fpc-v2-${{ steps.fpc.outputs.sha }}

      - name: Build funcmd.exe
        env:
          WINARM_FPC_ROOT: ${{ env.TOOLCHAIN_ROOT }}
          ZIG: ${{ env.ZIG_ROOT }}/zig
          FUN_WINARM_OUT: ${{ github.workspace }}/fun/funcmd-win-arm64.exe
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/build-funcmd-arm64.log"
          if ! ./src/prj/fun/make-win-arm64.sh > "$log" 2>&1; then
            echo "::error title=build (windows-arm64)::$(grep -E 'Fatal:|Error:|error:' "$log" | tail -5 | tr '\n' '~')"
            tail -40 "$log"
            exit 1
          fi
          tail -3 "$log"

      - name: Build funcmd-safe.exe
        env:
          WINARM_FPC_ROOT: ${{ env.TOOLCHAIN_ROOT }}
          ZIG: ${{ env.ZIG_ROOT }}/zig
          SAFE: strict
          FUN_WINARM_OUT: ${{ github.workspace }}/fun/funcmd-win-arm64-safe.exe
        run: |
          set -o pipefail
          log="$RUNNER_TEMP/build-funcmd-arm64-safe.log"
          if ! ./src/prj/fun/make-win-arm64.sh > "$log" 2>&1; then
            echo "::error title=safe build (windows-arm64)::$(grep -E 'Fatal:|Error:|error:' "$log" | tail -5 | tr '\n' '~')"
            tail -40 "$log"
            exit 1
          fi
          tail -3 "$log"

      - name: Build diagnostic hello.exe variants
        env:
          WINARM_FPC_ROOT: ${{ env.TOOLCHAIN_ROOT }}
          ZIG: ${{ env.ZIG_ROOT }}/zig
        run: |
          set -euo pipefail
          # A bare FPC program separates "the target's RTL is broken" from
          # "Fun trips a codegen bug". The test job runs it and reports the
          # exit code in an annotation.
          tools="$RUNNER_TEMP/winarm-tools"
          mkdir -p "$tools"
          cp src/prj/fun/win-arm64/clang "$tools/clang"
          chmod +x "$tools/clang"
          ln -sf clang "$tools/aarch64-win64-clang"
          export PATH="$tools:$PATH"
          printf "program hello;\nbegin\n  writeln('hello');\nend.\n" \
            > "$RUNNER_TEMP/hello.pas"
          for pair in "O0:-O-" "O1:-O1" "O2:-O2"; do
            tag="${pair%%:*}"
            opt="${pair#*:}"
            mkdir -p "$RUNNER_TEMP/hello-units-$tag"
            "$WINARM_FPC_ROOT/lib/fpc/3.3.1/ppcrossa64" \
              -n "$opt" -Twin64 -Paarch64 -XPaarch64-win64- \
              -Fu"$WINARM_FPC_ROOT/lib/fpc/3.3.1/units/aarch64-win64/*" \
              -FU"$RUNNER_TEMP/hello-units-$tag" -FE"$RUNNER_TEMP" \
              -o"$RUNNER_TEMP/hello-$tag.exe" "$RUNNER_TEMP/hello.pas"
          done
          ls -l "$RUNNER_TEMP"/hello-*.exe

      - name: Stage the build artifact
        run: |
          set -euo pipefail
          stage="$RUNNER_TEMP/build-stage"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp -f fun/funcmd-win-arm64.exe "$stage/funcmd.exe"
          cp -f fun/funcmd-win-arm64-safe.exe "$stage/funcmd-safe.exe"
          cp -f "$RUNNER_TEMP"/hello-O*.exe "$stage/"
          label="-dFunPack -dMD5 -dFunTraceback -dFunNoRes -O2"
          printf '%s\n' "$label" > "$stage/funcmd.flags.txt"
          echo "::warning title=build (windows-arm64) flags::[$label]"
          ls -l "$stage"

      - name: Upload the build
        uses: actions/upload-artifact@v4
        with:
          name: fun-win-arm64-build
          path: ${{ runner.temp }}/build-stage/
          retention-days: 7
          if-no-files-found: error

  # ---------------------------------------------------------------- TEST ---
  test:
    name: windows-arm64
    needs: build
    runs-on: windows-11-arm
    # The build is native; only the portable suite and two probes run here.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Download the build
        uses: actions/download-artifact@v4
        with:
          name: fun-win-arm64-build
          path: src/prj/fun

      - name: Optimization matrix
        shell: pwsh
        run: |
          # One annotation per candidate decides whether the FPC
          # win64/aarch64 RTL works at all on this host, independent of the
          # Fun interpreter, and whether optimization level matters.
          $dir = "$env:GITHUB_WORKSPACE\src\prj\fun"
          $script = "$env:RUNNER_TEMP\smoke.fun"
          "?. 'ok';" | Out-File -FilePath $script -Encoding ascii
          foreach ($v in @('hello-O0.exe','hello-O1.exe','hello-O2.exe')) {
            $out = & "$dir\$v" 2>&1
            Write-Host "::warning title=matrix $v::exit=$LASTEXITCODE out=[$($out -join '~')]"
          }
          $out = & "$dir\funcmd.exe" $script 2>&1
          Write-Host "::warning title=matrix funcmd.exe::exit=$LASTEXITCODE out=[$($out -join '~')]"
          $global:LASTEXITCODE = 0

      - name: Capability probes
        shell: pwsh
        run: |
          # Which optional features the build actually has, visible from
          # outside (the job log is not). Same regex probe the runner uses,
          # plus getapi when ffi.dll was provided.
          $exe = "$env:GITHUB_WORKSPACE\src\prj\fun\funcmd.exe"
          $probes = @{
            regex  = @("var r = 'a1b2'.replace(/\d++/g, '-');",
                       "if r = 'a-b-' then ?. 'on'; else ?. 'off'; end if;")
            getapi = @("var f = 'kernel32'.getapi('GetTickCount', ':i');",
                       "var t = f();",
                       "if t > 0 then ?. 'on'; else ?. 'off'; end if;")
          }
          foreach ($name in $probes.Keys) {
            $f = "$env:RUNNER_TEMP\probe-$name.fun"
            ($probes[$name]) -join "`n" | Out-File -FilePath $f -Encoding ascii
            $out = & $exe $f 2>&1
            Write-Host "::warning title=probe $name::exit=$LASTEXITCODE out=[$($out -join '~')]"
          }
          # Diagnostic only: 'off' or an error is a finding, not a regression.
          $global:LASTEXITCODE = 0

      - name: Regression (portable subset)
        shell: pwsh
        run: |
          # The shared snapshots are stored CRLF; match the win64 runner's
          # byte-for-byte comparison, including the lone trailing CR.
          $expSrc = "fun\test\expected"
          $expDst = "$env:RUNNER_TEMP\expected-win"
          Remove-Item -Recurse -Force $expDst -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $expDst | Out-Null
          Get-ChildItem "$expSrc\*.txt" | ForEach-Object {
            $b = [IO.File]::ReadAllBytes($_.FullName)
            if ($b.Length -gt 0 -and $b[$b.Length - 1] -eq 13) { $b += [byte]10 }
            [IO.File]::WriteAllBytes((Join-Path $expDst $_.Name), $b)
          }
          $env:FUNREG_EXPECTED = $expDst

          $log = "$env:RUNNER_TEMP\reg-windows-arm64.log"
          cmd /c "fun\test\run-windows-regression.bat --portable" 2>&1 |
            Tee-Object -FilePath $log
          $sum = (Get-Content $log | Select-String -Pattern 'checks passed' |
                    Select-Object -Last 1 | ForEach-Object { $_.Line.Trim() })
          Write-Host "::warning title=regression (windows-arm64) summary::$sum"
          if ($LASTEXITCODE -ne 0) {
            $head = (Get-Content $log | Select-Object -First 45 | ForEach-Object { $_ }) -join '~'
            Write-Host "::warning title=regression (windows-arm64) head::$($head.Substring(0, [Math]::Min(2500, $head.Length)))"
            $fails = (Get-Content $log |
                        Select-String -Pattern 'FAIL|failed|mismatch|not found|error' |
                        Select-Object -First 40 |
                        ForEach-Object { $_.Line }) -join ' | '
            if ([string]::IsNullOrEmpty($fails)) { $fails = "runner exited $LASTEXITCODE" }
            Write-Host "::error title=regression (windows-arm64)::$($fails.Substring(0, [Math]::Min(900, $fails.Length)))"
            exit 1
          }

      - name: Safe capability regression (strict)
        shell: pwsh
        run: |
          if (-not (Test-Path 'src\prj\fun\funcmd-safe.exe')) {
            Write-Host "::error title=safe regression (windows-arm64)::funcmd-safe.exe is missing"
            exit 1
          }
          $out = cmd /c "fun\test\run-safe-regression.bat strict" 2>&1
          $out | Write-Host
          if ($LASTEXITCODE -ne 0) {
            $fails = ($out | Select-String -Pattern 'not ok|FAIL|failed|safe regression|Error' |
                        Select-Object -Last 20 | ForEach-Object { $_.Line }) -join ' | '
            if ([string]::IsNullOrEmpty($fails)) { $fails = "runner exited $LASTEXITCODE" }
            Write-Host "::error title=safe regression (windows-arm64)::$fails"
            exit $LASTEXITCODE
          }
